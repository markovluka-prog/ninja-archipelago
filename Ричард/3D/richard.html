<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ричард Львиное Сердце — 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--ink:#2a2723;--mute:#7a746b;--card:rgba(255,255,255,.82);--accent:#b8861b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font:14px/1.35 -apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  body{background:radial-gradient(ellipse at 50% 38%,#f6f4ef 0%,#e4e1d9 55%,#c9c5bb 100%)}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  .hud{max-height:calc(100vh - 32px);overflow:auto;position:fixed;left:16px;top:16px;width:236px;padding:14px;border-radius:14px;background:var(--card);
       backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.12)}
  .hud h1{font-size:15px;margin:0 0 2px}
  .hud small{color:var(--mute)}
  .clips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
  button{font:inherit;border:1px solid #d6d1c6;background:#fff;border-radius:8px;padding:7px 8px;cursor:pointer;color:var(--ink)}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  label{display:flex;justify-content:space-between;align-items:center;margin:8px 0 2px;font-size:12px;color:var(--mute)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .row button{flex:1;white-space:nowrap}
  .chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--ink)}
  #loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--mute);pointer-events:none}
  body.nohud .hud{display:none}
</style>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="loading">Собираю Ричарда…</div>
<div class="hud" id="hud">
  <h1>Ричард Львиное Сердце</h1>
  <small>3D по фото фигурки · перетащи мышью, колесо — зум</small>
  <div class="clips" id="clips"></div>
  <div class="row"><button id="play">⏸ Пауза</button><button id="reset">Сброс</button></div>
  <label>Скорость <span id="vSpeed">1.0×</span></label><input id="speed" type="range" min="0.1" max="2" step="0.05" value="1">
  <label>Ветер на плащ <span id="vWind">0.6</span></label><input id="wind" type="range" min="0" max="3" step="0.05" value="0.6">
  <label>Жёсткость плаща <span id="vStiff">0.6</span></label><input id="stiff" type="range" min="0.1" max="1" step="0.05" value="0.6">
  <div class="chk"><input id="rot" type="checkbox"><label style="margin:0;color:inherit">Авто-вращение камеры</label></div>
  <div class="chk"><input id="sword" type="checkbox" checked><label style="margin:0;color:inherit">Меч</label>
                   <input id="shield" type="checkbox" checked style="margin-left:10px"><label style="margin:0;color:inherit">Щит</label></div>
  <div class="chk"><input id="skel" type="checkbox"><label style="margin:0;color:inherit">Показать скелет</label></div>
  <div class="row"><button id="playgame" style="background:#b8861b;color:#fff;border-color:#b8861b">▶ Играть (шаблон)</button></div>
  <div class="row"><button id="glb">Скачать .glb</button></div>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';

const Q = new URLSearchParams(location.search);
if (Q.get('hud') === '0') document.body.classList.add('nohud');

/* ───────────── renderer / scene ───────────── */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:Q.has('sheet')});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 4.2, 0);
controls.minDistance = 6; controls.maxDistance = 40; controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotateSpeed = 1.6;
const CAMS = {
  three:[8.5, 6.6, 18], front:[0, 4.8, 20], side:[20, 4.8, 0], back:[0, 5.5, -20], top:[0.1, 22, 7], close:[3, 7, 10]
};
function setCam(n){ const c = CAMS[n] || CAMS.three; camera.position.set(...c); controls.target.set(0, n==='close'?6.4:4.2, 0); controls.update(); }
setCam(Q.get('cam') || 'three');

const key = new THREE.DirectionalLight(0xfff4e6, 2.3);
key.position.set(6, 12, 8); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, {left:-9, right:9, top:10, bottom:-6, near:1, far:40});
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03;
scene.add(key);
const rim = new THREE.DirectionalLight(0xbcd0ff, 1.0); rim.position.set(-8, 6, -9); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0xcfc8ba, 0.35));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({opacity:0.22}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

/* ───────────── helpers ───────────── */
const rb = (w,h,d,r=0.12,seg=4) => new RoundedBoxGeometry(w,h,d,seg,Math.min(r, w/2-1e-3, h/2-1e-3, d/2-1e-3));
function mesh(parent, geo, mat, x=0,y=0,z=0, name){
  const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true; if (name) m.name = name; parent.add(m); return m;
}
function joint(parent, name, x=0,y=0,z=0){ const g = new THREE.Group(); g.name = name; g.position.set(x,y,z); parent.add(g); return g; }
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const plastic = (color, o={}) => new THREE.MeshPhysicalMaterial({color, roughness:0.38, clearcoat:0.6, clearcoatRoughness:0.28, ...o});
const M = {
  skin: plastic(0xf1bd9f, {roughness:0.45}),
  hair: plastic(0x121214, {roughness:0.5, side:THREE.DoubleSide}),
  gold: new THREE.MeshPhysicalMaterial({color:0xd29c1e, metalness:0.7, roughness:0.3, clearcoat:0.5, clearcoatRoughness:0.25}),
  goldDS: new THREE.MeshPhysicalMaterial({color:0xd29c1e, metalness:0.7, roughness:0.3, clearcoat:0.5, side:THREE.DoubleSide}),
  red: plastic(0xc3151b), black: plastic(0x1b1b1e, {roughness:0.42}), white: plastic(0xf3efe6),
  steel: plastic(0x56555b, {roughness:0.38, metalness:0.45}),
  cape: new THREE.MeshPhysicalMaterial({color:0x0e0e10, roughness:0.5, clearcoat:0.35, clearcoatRoughness:0.35, side:THREE.DoubleSide}),
  eye: plastic(0x3a1a10),
};

/* ───────────── textures (drawn on canvas) ───────────── */
function drawLion(g, cx, cy, s, mane, face, ink, crown){
  g.save(); g.translate(cx, cy); g.scale(s, s);
  g.fillStyle = mane; g.beginPath();
  const N = 18;
  for (let i = 0; i < N*2; i++){
    const a = i/(N*2)*Math.PI*2 - Math.PI/2, r = i%2 ? 0.8 : 1.0;
    g.lineTo(Math.cos(a)*r*0.95, Math.sin(a)*r + 0.12);
  }
  g.closePath(); g.fill();
  g.fillStyle = face; g.beginPath(); g.ellipse(0, 0.14, 0.56, 0.62, 0, 0, 7); g.fill();
  for (const sx of [-1,1]){ g.beginPath(); g.arc(sx*0.5, -0.4, 0.15, 0, 7); g.fill(); }
  g.fillStyle = ink;
  for (const sx of [-1,1]){
    g.beginPath(); g.moveTo(sx*0.1,-0.02); g.lineTo(sx*0.44,-0.16); g.lineTo(sx*0.36,0.04); g.closePath(); g.fill();
  }
  g.beginPath(); g.moveTo(-0.15,0.2); g.lineTo(0.15,0.2); g.lineTo(0,0.34); g.closePath(); g.fill();
  g.beginPath(); g.ellipse(0, 0.47, 0.27, 0.17, 0, 0, Math.PI); g.fill();
  g.fillStyle = face;
  for (const sx of [-0.12, 0.12]){ g.beginPath(); g.moveTo(sx-0.045,0.47); g.lineTo(sx+0.045,0.47); g.lineTo(sx,0.57); g.fill(); }
  // crown
  g.fillStyle = crown; g.beginPath();
  g.moveTo(-0.46,-0.78); g.lineTo(-0.5,-1.2); g.lineTo(-0.24,-0.98); g.lineTo(0,-1.32); g.lineTo(0.24,-0.98); g.lineTo(0.5,-1.2); g.lineTo(0.46,-0.78);
  g.closePath(); g.fill();
  for (const [x,y] of [[-0.5,-1.22],[0,-1.34],[0.5,-1.22]]){ g.beginPath(); g.arc(x,y,0.06,0,7); g.fill(); }
  g.restore();
}
const tabardFront = canvasTex(512, 592, (g, w, h) => {
  g.clearRect(0,0,w,h);
  g.fillStyle = '#f4f0e7'; g.beginPath(); g.roundRect(0, -20, w, 520, [0,0,46,46]); g.fill();       // белая накидка
  const gr = g.createLinearGradient(0,0,w,330); gr.addColorStop(0,'#e6b93a'); gr.addColorStop(.5,'#c99417'); gr.addColorStop(1,'#a9780f');
  g.fillStyle = gr; g.beginPath(); g.roundRect(46, -20, w-92, 360, [0,0,70,70]); g.fill();         // золотая грудь
  g.fillStyle = '#1f4aa8'; g.beginPath(); g.roundRect(78, -20, w-156, 318, [0,0,120,120]); g.fill(); // синее поле
  g.fillStyle = '#f4f0e7'; g.beginPath(); g.moveTo(w/2-58,-1); g.lineTo(w/2+58,-1); g.lineTo(w/2,50); g.closePath(); g.fill(); // белый воротник
  drawLion(g, w/2, 170, 105, '#dfe6f3', '#8aa7dc', '#173d92', '#eef2f9');
});
const tabardBack = canvasTex(512, 592, (g, w, h) => {
  g.fillStyle = '#f4f0e7'; g.beginPath(); g.roundRect(0,-20,w,520,[0,0,46,46]); g.fill();
  g.fillStyle = '#c99417'; g.fillRect(40,-20,w-80,34);
});
const R_HEAD = 1.0, H_HEAD = 1.9;
const faceTex = canvasTex(2048, 512, (g, W, H) => {
  g.fillStyle = '#f1bd9f'; g.fillRect(0,0,W,H);
  const px = x => W/2 + Math.asin(Math.max(-1, Math.min(1, x/R_HEAD)))/(2*Math.PI)*W;
  const py = y => (1 - y/H_HEAD)*H;
  g.fillStyle = '#3a1a10';
  for (const sx of [-1,1]){ g.beginPath(); g.ellipse(px(sx*0.42), py(0.98), 36, 31, 0, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.arc(px(sx*0.42)+10, py(0.98)-10, 7, 0, 7); g.fill(); g.fillStyle = '#3a1a10'; }
  g.fillStyle = 'rgba(214,120,110,.28)';
  for (const sx of [-1,1]){ g.beginPath(); g.ellipse(px(sx*0.62), py(0.62), 30, 18, 0, 0, 7); g.fill(); } // румянец
}); faceTex.wrapS = THREE.RepeatWrapping;
const shieldTex = canvasTex(512, 1024, (g, w, h) => {
  const half = w/2, mid = h*0.46;
  g.fillStyle='#1f4aa8'; g.fillRect(0,0,half,mid); g.fillStyle='#c3151b'; g.fillRect(half,0,half,mid);
  g.fillStyle='#c3151b'; g.fillRect(0,mid,half,h-mid); g.fillStyle='#1f4aa8'; g.fillRect(half,mid,half,h-mid);
  g.strokeStyle='#d29c1e'; g.lineWidth=10; g.beginPath(); g.moveTo(half,0); g.lineTo(half,h); g.moveTo(0,mid); g.lineTo(w,mid); g.stroke();
  drawLion(g, half, h*0.40, 175, '#16358a', '#2f5cc0', '#eaf0fb', '#e0aa22');
});

/* ───────────── figure ───────────── */
const figure = new THREE.Group(); figure.name = 'Figure'; scene.add(figure);
const root = joint(figure, 'Root');
const spin = joint(root, 'Spin', 0, 4.0, 0);          // центр масс: вокруг него сальто/развороты
const body = joint(spin, 'Body', 0, -4.0, 0);
const torso = joint(body, 'Torso', 0, 3.0, 0);

// торс
mesh(torso, rb(2.6,1.75,1.3,0.22), M.gold, 0, 1.32, 0, 'ChestPlate');
mesh(torso, rb(2.3,1.0,1.22,0.2), M.red, 0, 0.42, 0, 'Hips');
for (const [tex, z, ry] of [[tabardFront, 0.668, 0], [tabardBack, -0.668, Math.PI]]){
  const p = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 2.2*0.98), new THREE.MeshPhysicalMaterial({
    map:tex, transparent:true, alphaTest:0.5, roughness:0.4, clearcoat:0.5, polygonOffset:true, polygonOffsetFactor:-2}));
  p.position.set(0, 2.2/2 + 0.0 + 0.1 - 0.0, z); p.rotation.y = ry; p.position.y = 1.15; p.receiveShadow = true; p.castShadow = true; p.name = ry ? 'TabardBack' : 'TabardFront';
  torso.add(p);
}
// шея, воротник, шнурок плаща
mesh(torso, new THREE.CylinderGeometry(0.44,0.5,0.42,32), M.white, 0, 2.3, 0, 'Neck');
const collar = mesh(torso, new THREE.TorusGeometry(0.52,0.09,10,40), M.gold, 0, 2.2, 0); collar.rotation.x = Math.PI/2;
const cord = mesh(torso, new THREE.TorusGeometry(0.5,0.045,8,40), M.black, 0, 2.42, 0); cord.rotation.x = Math.PI/2; cord.name='CapeCord';

// голова
const head = joint(torso, 'Head', 0, 2.48, 0);
{
  const prof = new THREE.SplineCurve([[0,0],[0.55,0.02],[0.86,0.18],[0.985,0.55],[1.0,0.95],[0.99,1.3],[0.9,1.62],[0.65,1.82],[0.3,1.895],[0,1.9]].map(p => new THREE.Vector2(...p))).getPoints(48);
  const geo = new THREE.LatheGeometry(prof, 56);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++){
    uv.setXY(i, Math.atan2(pos.getX(i), pos.getZ(i))/(2*Math.PI) + 0.5, pos.getY(i)/H_HEAD);
  }
  mesh(head, geo, new THREE.MeshPhysicalMaterial({map:faceTex, roughness:0.42, clearcoat:0.5, clearcoatRoughness:0.3}), 0, 0, 0, 'HeadShell');
  const mouth = joint(head, 'Mouth', 0, 0.64, 0.972);
  const ms = new THREE.Shape(); ms.moveTo(-0.22,0); ms.quadraticCurveTo(0,-0.07,0.22,0); ms.quadraticCurveTo(0,-0.42,-0.22,0);
  const mm = new THREE.Mesh(new THREE.ShapeGeometry(ms, 14), new THREE.MeshStandardMaterial({color:0x3a1a10, roughness:0.4, polygonOffset:true, polygonOffsetFactor:-3}));
  mm.name = 'MouthShape'; mouth.add(mm);
  // волосы: каре + рваная чёлка
  const dome = mesh(head, new THREE.SphereGeometry(1.07, 40, 20, 0, Math.PI*2, 0, Math.PI/2), M.hair, 0, 1.2, 0, 'HairDome'); dome.scale.y = 0.72;
  const side = new THREE.CylinderGeometry(1.07, 1.1, 0.95, 48, 1, true, THREE.MathUtils.degToRad(62), THREE.MathUtils.degToRad(236));
  mesh(head, side, M.hair, 0, 0.74, 0, 'HairSides');
  const fr = [], idx = [];
  const T = 9, a0 = THREE.MathUtils.degToRad(-66), a1 = THREE.MathUtils.degToRad(66);
  for (let i = 0; i <= T*2; i++){
    const a = a0 + (a1 - a0)*i/(T*2), r = 1.075;
    fr.push(Math.sin(a)*r, 1.42, Math.cos(a)*r);                      // верхняя кромка
    fr.push(Math.sin(a)*r, i%2 ? 1.16 : 1.3, Math.cos(a)*r);          // зубцы
  }
  for (let i = 0; i < T*2; i++){ const k = i*2; idx.push(k,k+1,k+2, k+1,k+3,k+2); }
  const fg = new THREE.BufferGeometry(); fg.setAttribute('position', new THREE.Float32BufferAttribute(fr,3)); fg.setIndex(idx); fg.computeVertexNormals();
  mesh(head, fg, M.hair, 0, 0, 0, 'Fringe');
  // корона
  const crown = joint(head, 'Crown');
  mesh(crown, new THREE.CylinderGeometry(1.14,1.11,0.48,56,1,true), M.goldDS, 0, 1.68, 0, 'CrownBand');
  for (const y of [1.44, 1.92]){ const t = mesh(crown, new THREE.TorusGeometry(1.125,0.05,8,64), M.gold, 0, y, 0); t.rotation.x = Math.PI/2; }
  for (let i = 0; i < 14; i++){ const a = i/14*Math.PI*2; mesh(crown, new THREE.SphereGeometry(0.045,8,6), M.gold, Math.sin(a)*1.145, 1.68, Math.cos(a)*1.145); }
  for (let i = 0; i < 8; i++){
    const a = i*Math.PI/4, h = i === 0 ? 0.5 : (i % 2 ? 0.3 : 0.42);
    const s = new THREE.Shape(); s.moveTo(-0.29,0); s.lineTo(0.29,0); s.lineTo(0.27,h*0.55); s.quadraticCurveTo(0.2,h,0,h); s.quadraticCurveTo(-0.2,h,-0.27,h*0.55); s.closePath();
    const g = new THREE.ExtrudeGeometry(s, {depth:0.1, bevelEnabled:true, bevelSize:0.03, bevelThickness:0.03, bevelSegments:2, curveSegments:10}); g.translate(0,0,-0.05);
    const pr = mesh(crown, g, M.gold, Math.sin(a)*1.1, 1.9, Math.cos(a)*1.1); pr.rotation.y = a;
    mesh(pr, new THREE.SphereGeometry(0.08,10,8), M.gold, 0, h+0.02, 0);
    if (i === 0){
      mesh(pr, rb(0.12,0.42,0.11,0.04,2), M.gold, 0, h+0.22, 0);
      mesh(pr, rb(0.34,0.12,0.11,0.04,2), M.gold, 0, h+0.28, 0);
    }
  }
}

// руки: плечо → локоть → кисть (C-захват). Локти/колени — добавка к настоящей игрушке ради анимации
function handGeo(){
  const R = 0.34, r = 0.165, gap = 0.75, sh = new THREE.Shape();
  const a0 = -Math.PI/2 + gap/2, a1 = -Math.PI/2 + Math.PI*2 - gap/2;
  sh.absarc(0,0,R,a0,a1,false); sh.absarc(0,0,r,a1,a0,true); sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, {depth:0.55, bevelEnabled:true, bevelSize:0.035, bevelThickness:0.035, bevelSegments:2, curveSegments:28});
  g.translate(0,0,-0.275); return g;
}
function buildArm(side){
  const L = side > 0, sh = joint(torso, L ? 'ShoulderL' : 'ShoulderR', side*1.52, 2.0, 0);
  const pa = mesh(sh, new THREE.SphereGeometry(0.6, 28, 16, 0, Math.PI*2, 0, Math.PI*0.6), M.goldDS, 0, 0.08, 0, 'Pauldron'); pa.scale.set(1.0,0.85,1.0);
  for (const [y, r, h] of [[-0.3,0.46,0.42],[-0.68,0.41,0.34]]) mesh(sh, new THREE.CylinderGeometry(r*0.97, r, h, 28), M.gold, 0, y, 0);
  const el = joint(sh, L ? 'ElbowL' : 'ElbowR', 0, -0.85, 0);
  mesh(el, new THREE.SphereGeometry(0.38, 20, 14), M.gold, 0, 0, 0, 'ElbowCap');
  mesh(el, new THREE.CylinderGeometry(0.44, 0.45, 0.3, 28), M.gold, 0, -0.18, 0);
  mesh(el, new THREE.CylinderGeometry(0.3, 0.33, 0.5, 20), M.gold, 0, -0.45, 0);
  const wrist = joint(el, L ? 'WristL' : 'WristR', 0, -0.7, 0);
  mesh(wrist, handGeo(), M.gold, 0, 0, 0, 'Hand');
  return wrist;
}
const wristL = buildArm(+1), wristR = buildArm(-1);

function buildLeg(side){
  const L = side > 0, hip = joint(body, L ? 'HipL' : 'HipR', side*0.52, 3.0, 0);
  mesh(hip, rb(1.0,1.55,1.08,0.2), M.red, 0, -0.78, 0, 'Thigh');
  const knee = joint(hip, L ? 'KneeL' : 'KneeR', 0, -1.55, 0);
  mesh(knee, rb(1.0,0.42,1.08,0.17), M.red, 0, 0.0, 0, 'KneeCap');
  mesh(knee, rb(0.98,1.6,1.06,0.2), M.black, 0, -0.65, 0, 'Boot');
  mesh(knee, rb(0.98,0.45,1.5,0.18), M.black, 0, -1.23, 0.22, 'Foot');
  joint(knee, L ? 'AnkleL' : 'AnkleR', 0, -1.45, 0);
  return hip;
}
buildLeg(+1); buildLeg(-1);

// меч (в левой руке: блеск, гарда, навершие)
const sword = joint(wristL, 'Sword');
{

const _v = new THREE.Vector3(), _w = new THREE.Vector3(), _a = new THREE.Vector3(), _b = new THREE.Vector3(), _n = new THREE.Vector3();
const capsules = [['ShoulderL','ElbowL'],['ElbowL','WristL'],['ShoulderR','ElbowR'],['ElbowR','WristR']]
  .map(([a, b]) => ({a: J(a), b: J(b), r: 0.6, A: new THREE.Vector3(), B: new THREE.Vector3()}));
function refreshColliders(){
  for (const b of colBoxes){ b.o.updateWorldMatrix(true, false); b.fwd.copy(b.o.matrixWorld); b.inv.copy(b.o.matrixWorld).invert(); }
  for (const c of capsules){ c.a.getWorldPosition(c.A); c.b.getWorldPosition(c.B); }
}
function collide(p){
  for (const b of colBoxes){
    _v.copy(p).applyMatrix4(b.inv).sub(b.c);
    const m = 0.09, dx = b.h.x + m - Math.abs(_v.x), dy = b.h.y + m - Math.abs(_v.y), dz = b.h.z + m - Math.abs(_v.z);
    if (dx > 0 && dy > 0 && dz > 0){
      if (dx < dy && dx < dz) _v.x = Math.sign(_v.x || 1)*(b.h.x + m);
      else if (dz < dy)       _v.z = Math.sign(_v.z || -1)*(b.h.z + m);
      else                    _v.y = Math.sign(_v.y || 1)*(b.h.y + m);
      p.copy(_v.add(b.c)).applyMatrix4(b.fwd);
    }
  }
  for (const c of capsules){
    _a.copy(c.B).sub(c.A); const t = THREE.MathUtils.clamp(_w.copy(p).sub(c.A).dot(_a)/_a.lengthSq(), 0, 1);
    _b.copy(c.A).addScaledVector(_a, t); _n.copy(p).sub(_b); const d = _n.length();
    if (d < c.r){ if (d < 1e-5) _n.set(0,0,-1); else _n.divideScalar(d); p.copy(_b).addScaledVector(_n, c.r); }
  }

const capeNormals = new THREE.Vector3();
function capeStep(h){
  sim.t += h;
  refreshColliders(); torso.updateWorldMatrix(true, false);
  const g = -42, damp = 0.985, N = cape.n;
  const wnd = _w.set(0.35*Math.sin(sim.t*0.9) + 0.15*Math.sin(sim.t*2.3), 0.05*Math.sin(sim.t*1.3), -1).normalize();
  const gust = (sim.wind + (curMeta.wind || 0))*(0.7 + 0.3*Math.sin(sim.t*1.7) + 0.2*Math.sin(sim.t*3.9));
  const nrm = cape.geo.attributes.normal;
  const kk = {st: 1, sh: 0.9, bd: sim.stiff};
  for (let sub = 0; sub < 2; sub++){
    const dt = h/2;
    for (let i = CW; i < N; i++){
      const p = cape.p[i], q = cape.q[i];
      _v.copy(p).sub(q).multiplyScalar(damp); q.copy(p);
      let ax = 0, ay = g, az = 0;
      if (nrm && gust > 0){ const nx = nrm.getX(i), ny = nrm.getY(i), nz = nrm.getZ(i), d = (nx*wnd.x + ny*wnd.y + nz*wnd.z)*gust*55; ax += nx*d; ay += ny*d; az += nz*d; }
      p.x += _v.x + ax*dt*dt; p.y += _v.y + ay*dt*dt; p.z += _v.z + az*dt*dt;
    }
    for (let c = 0; c < CW; c++){ const p = cape.p[c]; torso.localToWorld(p.copy(cape.pinLocal[c])); cape.q[c].copy(p); }
    for (let it = 0; it < 10; it++){
      for (const [a, b, L, k] of cape.cons){
        const pa = cape.p[a], pb = cape.p[b]; _v.copy(pb).sub(pa); const d = _v.length(); if (d < 1e-6) continue;
        const wa = a < CW ? 0 : 1, wb = b < CW ? 0 : 1, ws = wa + wb; if (!ws) continue;
        const f = (d - L)/d*kk[k]/ws; pa.addScaledVector(_v, f*wa); pb.addScaledVector(_v, -f*wb);
      }
      for (let i = CW; i < N; i++) collide(cape.p[i]);
    }
  }
}
function capeUpload(){
  const a = cape.geo.attributes.position.array;
  for (let i = 0; i < cape.n; i++){ a[i*3] = cape.p[i].x; a[i*3+1] = cape.p[i].y; a[i*3+2] = cape.p[i].z; }
  cape.geo.attributes.position.needsUpdate = true; cape.geo.computeVertexNormals(); cape.geo.computeBoundingSphere();
}
function capeReset(){
  torso.updateWorldMatrix(true, true);
  for (let i = 0; i < cape.n; i++){ torso.localToWorld(cape.p[i].copy(cape.pinLocal[i])); cape.q[i].copy(cape.p[i]); }
  capeUpload(); sim.t = 0;
}

/* ───────────── animation (joint hierarchy + keyframes with easing) ───────────── */
const PI = Math.PI, TAU = Math.PI*2, clamp = THREE.MathUtils.clamp;
const BASE = {
  Root:[0,0,0], Spin:[0,0,0], Torso:[0,0,0], Head:[0,0,0],
  ShoulderL:[-0.5,0,0.16], ElbowL:[0,0,0], WristL:[-0.7,0,0],        // меч слегка вперёд-вверх
  ShoulderR:[-0.45,0,-0.08], ElbowR:[0,0,0], WristR:[0,-PI/2,0],     // щит лицом вперёд
  HipL:[0,0,0], KneeL:[0,0,0], HipR:[0,0,0], KneeR:[0,0,0],
  Mouth:[0.85], G:[0], Lift:[0],   // G=1: решатель «стопы на земле»; Lift: высота самой низкой стопы над землёй
};
const EASE = {io:u=>u*u*(3-2*u), in:u=>u*u*u, out:u=>1-Math.pow(1-u,3), lin:u=>u, back:u=>{const c=1.70158;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2);}};
// sp  = тангаж клинка (сумма углов плечо+локоть+кисть), shp = тангаж щита — автоматически считают WristL/WristR
function resolve(k, cb = {}){
  const p = {...BASE, ...cb, ...k};
  if (k.sp !== undefined && !k.WristL) p.WristL = [k.sp - p.ShoulderL[0] - p.ElbowL[0], 0, 0];
  if (k.shp !== undefined && !k.WristR) p.WristR = [k.shp - p.ShoulderR[0] - p.ElbowR[0], -PI/2, 0];
  return p;
}
const L1 = 1.55, L2 = 1.45;   // бедро и голень+стопа
const legY = (h, k, z) => (L1*Math.cos(h) + L2*Math.cos(h + k))*Math.cos(z);
const solveRoot = p => Math.max(legY(p.HipL[0], p.KneeL[0], p.HipL[2]), legY(p.HipR[0], p.KneeR[0], p.HipR[2])) - 3.0;
// касательные Фрица–Карлсона (без перелётов); если первая и последняя позы совпадают — клип считается циклом и касательные замыкаются
function hermiteTangents(R, names){
  const N = R.length, same = names.every(j => R[0].p[j].every((x, n) => Math.abs(x - R[N-1].p[j][n]) < 1e-6));
  const T = R.map(() => ({}));
  const period = R[N-1].t - R[0].t;
  for (const j of names) for (let k = 0; k < N; k++) T[k][j] = R[k].p[j].map((_, n) => {
    const get = q => R[q].p[j][n];
    let dl = null, dr = null, hl = 0, hr = 0;
    if (k > 0){ hl = R[k].t - R[k-1].t; dl = (get(k) - get(k-1))/hl; } else if (same){ hl = R[N-1].t - R[N-2].t; dl = (get(N-1) - get(N-2))/hl; }
    if (k < N-1){ hr = R[k+1].t - R[k].t; dr = (get(k+1) - get(k))/hr; } else if (same){ hr = R[1].t - R[0].t; dr = (get(1) - get(0))/hr; }
    if (dl === null || dr === null || dl*dr <= 0) return 0;
    const w1 = 2*hr + hl, w2 = hr + 2*hl;
    return (w1 + w2)/(w1/dl + w2/dr);
  });
  return T;
}
const JUMP_K = 1.9;   // множитель высоты всех прыжков
function makeClip(name, dur, keys, opt = {}, fps = 30){
  const cb = opt.base || {}, R = keys.map(k => { const p = resolve(k, cb); if (p.Lift[0] > 0.5) p.Lift = [p.Lift[0]*JUMP_K]; return {t:k.t, ease:k.ease, p}; });
  const names = Object.keys(BASE), TG = hermiteTangents(R, names), times = [], vals = Object.fromEntries(names.map(n => [n, []]));
  const eul = new THREE.Euler(), qq = new THREE.Quaternion();
  for (let f = 0; f <= Math.round(dur*fps); f++){
    const t = f/fps; times.push(t);
    let i = 0; while (i < R.length-2 && t > R[i+1].t) i++;
    const A = R[i], B = R[i+1], h = B.t - A.t, u = clamp((t - A.t)/h, 0, 1), p = {};
    // монотонный кубический Эрмит: скорость непрерывна через ключи, останавливаемся только там, где следующая поза = удержание
    const u2 = u*u, u3 = u2*u, h00 = 2*u3 - 3*u2 + 1, h10 = u3 - 2*u2 + u, h01 = -2*u3 + 3*u2, h11 = u3 - u2;
    for (const j of names) p[j] = A.p[j].map((x, n) => h00*x + h10*h*TG[i][j][n] + h01*B.p[j][n] + h11*h*TG[i+1][j][n]);
    p.Root = [p.Root[0], p.Root[1] + p.G[0]*solveRoot(p) + p.Lift[0], p.Root[2]];
    if (opt.extra) opt.extra(t, p);
    for (const j of names){
      if (j === 'G' || j === 'Lift') continue;
      if (j === 'Root') vals.Root.push(...p.Root);
      else if (j === 'Mouth') vals.Mouth.push(1, p.Mouth[0], 1);
      else { eul.set(p[j][0], p[j][1], p[j][2]); qq.setFromEuler(eul); vals[j].push(qq.x, qq.y, qq.z, qq.w); }
    }
  }
  const tracks = [];
  for (const j of names){
    if (j === 'G' || j === 'Lift') continue;
    tracks.push(j === 'Root' ? new THREE.VectorKeyframeTrack('Root.position', times, vals.Root)
              : j === 'Mouth' ? new THREE.VectorKeyframeTrack('Mouth.scale', times, vals.Mouth)

  return {Spin:[0.14,0,0], Torso:[0,0.12*s,0], Head:[-0.12,-0.1*s,0],
    HipL:[L.h,0,0], KneeL:[L.k,0,0], HipR:[R.h,0,0], KneeR:[R.k,0,0],

    G:[1], Lift:[0.1*Math.abs(Math.sin(2*ph))]};
}

function findLedge(yaw){
  const f = dirFrom(yaw); let best = null, bd = 1e9;
  for (const b of solids){
    if (b.grab === false) continue; const rel = b.max.y - P.pos.y; if (rel < REACH_LO || rel > REACH_HI) continue;
    const dx = Math.max(b.min.x - P.pos.x, P.pos.x - b.max.x), dz = Math.max(b.min.z - P.pos.z, P.pos.z - b.max.z); if (dx < 0 && dz < 0) continue;
    let n, dist;
    if (dx >= dz){ n = new V3(P.pos.x < b.min.x ? -1 : 1, 0, 0); dist = dx; if (P.pos.z < b.min.z - 0.2 || P.pos.z > b.max.z + 0.2) continue; }
    else { n = new V3(0, 0, P.pos.z < b.min.z ? -1 : 1); dist = dz; if (P.pos.x < b.min.x - 0.2 || P.pos.x > b.max.x + 0.2) continue; }
    if (dist > R + 1.5 || -(f.x*n.x + f.z*n.z) < 0.5) continue;
    // над краем должно быть свободно
    const face = n.x ? (n.x > 0 ? b.max.x : b.min.x) : (n.z > 0 ? b.max.z : b.min.z);
    if (dist < bd){ bd = dist; best = {b, n, top:b.max.y, face}; }
  }
  return best;
}

}

function stGround(h){

  if (pressed.has('KeyL')) return startBash();
  if (pressed.has('KeyF')) return startKick();
  if (buf.roll > 0){ buf.roll = 0; return startRoll(); }
  if (pressed.has('KeyV') && sp > 8) return startSlide();

  if (buf.jump > 0){ buf.jump = 0; return startJump(); }
  if (kd.has('KeyW') && !P.lad){ const l = ladderNear(); if (l && mv.x*-l.n.x + mv.z*-l.n.z > 0.6) return startLadder(l); }
}

function stAir(h){

function stHang(h){

  const sp = Math.hypot(P.vel.x, P.vel.z); setAnim('Плавание', {speed:0.5 + sp/6, fade:0.2});
  if (pressed.has('Space') || buf.jump > 0){ buf.jump = 0; const L = findLedge(P.yaw) || findLedge(Math.atan2(mv.x, mv.z)); if (L){ P.regrab = 0; return startHang(L); } }
  if (P.t % 0.18 < h && sp > 1) burst(new V3(P.pos.x, w.y, P.pos.z), 1, 'water', 4, 3);
}
function stAttack(h){
  const A = P.atk, n = A.n, W = [[0.40, 0.56], [0.33, 0.52], [0.40, 0.58]][n], dur = [1.0, 0.9, 1.0][n], dmg = [10, 12, 18][n];
  if (pressed.has('KeyJ')) A.buf = true;
  const mv = moveInput(), f = dirFrom(P.yaw);
  const lv = [9, 8, 13][n]; const lunge = P.t > W[0] - 0.18 && P.t < W[1] ? lv : 0; P.vel.x += (f.x*lunge - P.vel.x)*dampK(14, h); P.vel.z += (f.z*lunge - P.vel.z)*dampK(14, h);
  moveBody(h, P.hh, 0.4); const gy = groundAt(P.pos.x, P.pos.z, P.pos.y, STEP); if (gy > -Infinity) P.pos.y = gy;
  if (P.t > W[0] && P.t < W[1]) meleeHits(n === 2 ? 11 : 9.5, n === 2 ? 0.55 : 0.2, dmg, n === 2 ? 14 : 8, 0);
  if (P.t > W[1] + 0.02 && A.buf){ return startAttack((n + 1)%3); }
  if (P.t > W[1] + 0.05){ if (buf.roll > 0){ buf.roll = 0; return startRoll(); } if (kd.has('KeyK')) return startBlock(); if (buf.jump > 0){ buf.jump = 0; return startJump(); } if (pressed.has('KeyF')) return startKick(); }
  if (P.t >= dur){ setState('ground'); P.landT = 0; }
}
function stKick(h){
  const f = dirFrom(P.yaw); const lunge = P.t > 0.1 && P.t < 0.32 ? 7 : 0; P.vel.x += (f.x*lunge - P.vel.x)*dampK(14, h); P.vel.z += (f.z*lunge - P.vel.z)*dampK(14, h);
  moveBody(h, P.hh, 0.4); const gy = groundAt(P.pos.x, P.pos.z, P.pos.y, STEP); if (gy > -Infinity) P.pos.y = gy;
  if (P.t > 0.26 && P.t < 0.42 && meleeHits(8.4, 0.35, 8, 15, 0.9)) burst(P.pos.clone().add(f.clone().multiplyScalar(5)).setY(3.5), 8, 'dust', 10, 5);
  if (P.t > 0.5){ if (pressed.has('KeyJ')) return startAttack(0); if (buf.roll > 0){ buf.roll = 0; return startRoll(); } }
  if (P.t >= 0.85){ setState('ground'); P.landT = 0; }
}
function stBash(h){
  const f = dirFrom(P.yaw); const lunge = P.t > 0.22 && P.t < 0.45 ? 8 : 0; P.vel.x += (f.x*lunge - P.vel.x)*dampK(14, h); P.vel.z += (f.z*lunge - P.vel.z)*dampK(14, h);
  moveBody(h, P.hh, 0.4); const gy = groundAt(P.pos.x, P.pos.z, P.pos.y, STEP); if (gy > -Infinity) P.pos.y = gy;
  if (P.t > 0.36 && P.t < 0.52) meleeHits(8, 0.3, 6, 18, 1.5);
  if (P.t > 0.65 && pressed.has('KeyJ')) return startAttack(0);
  if (P.t >= 1.1){ setState('ground'); P.landT = 0; }
}
function stBlock(h){
  P.blockT += h; const mv = moveInput(); locomotion(h, mv, 0.3, false); const e = nearestEnemy(30); if (e) faceToward(e.g.position.clone().sub(P.pos), 10, h);
  moveBody(h, P.hh, STEP); const gy = groundAt(P.pos.x, P.pos.z, P.pos.y, STEP); if (gy > -Infinity) P.pos.y = gy;
  if (pressed.has('KeyJ')) return startAttack(0); if (buf.roll > 0){ buf.roll = 0; return startRoll(); } if (pressed.has('KeyL')) return startBash();
  if (!kd.has('KeyK') && P.blockT > 0.12){ setState('ground'); P.landT = 0; }
}
function stParry(h){
  P.vel.multiplyScalar(Math.exp(-8*h)); moveBody(h, P.hh, 0.4);
  if (P.t > 0.12 && pressed.has('KeyJ')) return startAttack(0);   // ответный удар
  if (P.t >= 0.45){ if (kd.has('KeyK')){ setState('block'); P.blockT = 1; setAnim('Блок', {loop:false, fade:0.05, restart:true}); } else { setState('ground'); P.landT = 0; } }
}
function stRoll(h){
  const u = P.t/0.85, v = u < 0.8 ? 15 : 15*(1 - (u - 0.8)/0.2*0.7); P.vel.x = P.rdir.x*v; P.vel.z = P.rdir.z*v;
  moveBody(h, P.hh, 0.5); const gy = groundAt(P.pos.x, P.pos.z, P.pos.y, STEP);
  if (gy === -Infinity || P.pos.y - gy > 1.4){ P.vel.y = 0; setState('air'); P.hh = HH; P.air = 0; P.hasJumped = false; return; } P.pos.y = gy;
  if (P.t >= 0.85){ if (blockedAt(P.pos.x, P.pos.y, P.pos.z, HH, 0.3)) return; P.hh = HH; setState('ground'); P.landT = 0; P.vel.multiplyScalar(0.5); }
}
function stSlide(h){
  P.slideV = Math.max(5, P.slideV - 14*h); P.vel.x = P.sdir.x*P.slideV; P.vel.z = P.sdir.z*P.slideV;
  moveBody(h, P.hh, 0.5); const gy = groundAt(P.pos.x, P.pos.z, P.pos.y, STEP);
  if (gy === -Infinity || P.pos.y - gy > 1.4){ setState('air'); P.hh = HH; P.air = 0; P.hasJumped = false; return; } P.pos.y = gy;
  if (buf.jump > 0 && !blockedAt(P.pos.x, P.pos.y, P.pos.z, HH, 0.3)){ buf.jump = 0; P.hh = HH; return startJump(); }
  if (P.t >= 0.95 && !blockedAt(P.pos.x, P.pos.y, P.pos.z, HH, 0.3)){ P.hh = HH; setState('ground'); P.landT = 0; }
}
function stLand(h){ P.vel.multiplyScalar(Math.exp(-10*h)); moveBody(h, P.hh, 0.4); if (P.t >= 0.7){ setState('ground'); P.landT = 0; } }
function stHit(h){ P.vel.multiplyScalar(Math.exp(-6*h)); moveBody(h, P.hh, 0.4); const gy = groundAt(P.pos.x, P.pos.z, P.pos.y, STEP); if (gy > -Infinity) P.pos.y = gy; if (P.t >= 0.45){ setState('ground'); P.landT = 0; } }
function stInteract(h){
  P.vel.multiplyScalar(0); if (!P.didFx && P.t > 0.4){ P.didFx = true; interactFx(P.it); }
  if (P.t >= (P.it.kind === 'relic' ? 1.0 : 0.85)){ setState('ground'); P.landT = 0; }
}
function stDead(h){ P.vel.multiplyScalar(Math.exp(-6*h)); moveBody(h, P.hh, 0.4); }

/* ───────────── шаг симуляции ───────────── */
const stateFns = {ground:stGround, air:stAir, glide:stGlide, wallslide:stWall, hang:stHang, climb:stClimb, ladder:stLadder, swim:stSwim, attack:stAttack, kick:stKick, bash:stBash, block:stBlock, parry:stParry, roll:stRoll, slide:stSlide, land:stLand, hit:stHit, interact:stInteract, dead:stDead};
function gStep(h){
  if (hitStop > 0){ hitStop -= h; capeStep(h*0.3); return; }
  P.simT += h; P.t += h; P.inv = Math.max(0, P.inv - h);
  for (const k of ['jump', 'atk', 'roll']) buf[k] = Math.max(0, buf[k] - h);
  if (pressed.has('Space')) buf.jump = 0.14; if (pressed.has('KeyJ')) buf.atk = 0.18; if (pressed.has('KeyC')) buf.roll = 0.22;
  if (pressed.has('KeyR') && (P.dead || kd.has('ShiftLeft'))) respawn();
  curMeta = P.state === 'glide' ? {wind:2.8} : (Math.hypot(P.vel.x, P.vel.z) > 10 ? {wind:0.9} : {});
  stateFns[P.state](h);
  if (P.state !== 'attack' && P.state !== 'kick' && P.state !== 'bash'){ /* ничего */ }
  if (P.state === 'ground' || P.state === 'air') { /* высота обычная */ P.hh = HH; }
  if (P.pos.y < -22 && !['swim', 'hang', 'climb'].includes(P.state)) fellOff();
  enemiesUpdate(h); partsUpdate(h);
  // монеты, сундук, рычаг, ворота, реликвия
  for (const c of coins){ if (c.taken) continue; c.g.rotation.y += 3*h; c.g.position.y += Math.sin(P.simT*3 + c.g.position.x)*0.01; if (c.g.position.distanceTo(P.pos.clone().setY(P.pos.y + 4)) < 3.4){ c.taken = true; c.g.visible = false; P.coins++; burst(c.g.position.clone(), 6, 'spark', 8, 8); } }
  chest.open += (chest.target - chest.open)*dampK(5, h); chest.lid.rotation.x = -chest.open*1.9;
  lever.h.rotation.x += ((lever.on ? -0.7 : 0.7) - lever.h.rotation.x)*dampK(8, h);
  const gy = lever.on ? -11.2 : 0, cur = GATE.mesh.position.y - 5.5; const ny = cur + (gy - cur)*dampK(2.5, h) ; GATE.mesh.position.y = 5.5 + ny; GATE.min.y = ny; GATE.max.y = 11 + ny;
  relic.rotation.y += 2*h; relic.position.y = 27.8 + Math.sin(P.simT*2)*0.3;
  // фигура
  P.yawVis += (() => { let d = P.yaw - P.yawVis; d = Math.atan2(Math.sin(d), Math.cos(d)); return d*Math.min(1, 22*h); })();
  figure.position.copy(P.pos); figure.rotation.y = P.yawVis;
  mixer.update(h); figure.updateMatrixWorld(true);
  capeFloor = P.state === 'swim' ? P.pos.y + 2 : P.pos.y + 0.03; capeStep(h);
  pressed.clear();
}

/* ───────────── камера ───────────── */
let camTgt = new V3(), shakeV = new V3();
function camClip(o, d, maxD){ // луч от цели к камере: подтягиваем камеру перед стенами
  let best = maxD;
  for (const b of solids){
    let t0 = 0, t1 = best + 1.2, ok = true;
    for (const ax of ['x', 'y', 'z']){
      const mn = b.min[ax] - 0.3, mx = b.max[ax] + 0.3, da = d[ax], oa = o[ax];
      if (Math.abs(da) < 1e-6){ if (oa < mn || oa > mx){ ok = false; break; } }
      else { let a = (mn - oa)/da, c = (mx - oa)/da; if (a > c) [a, c] = [c, a]; t0 = Math.max(t0, a); t1 = Math.min(t1, c); if (t0 > t1){ ok = false; break; } }
    }
    if (ok && t0 > 0 && t0 - 1.2 < best) best = Math.max(11, t0 - 1.2);
  }
  return best;
}
function camUpdate(dt, snap = false){
  const r = 1.7*dt; if (kd.has('ArrowLeft')) camYaw += r; if (kd.has('ArrowRight')) camYaw -= r; if (kd.has('ArrowUp')) camPit = Math.min(1.2, camPit + r*0.6); if (kd.has('ArrowDown')) camPit = Math.max(-0.2, camPit - r*0.6);
  const want = new V3(P.pos.x, P.pos.y + 5.2, P.pos.z);
  if (snap) camTgt.copy(want); else { camTgt.x += (want.x - camTgt.x)*dampK(12, dt); camTgt.z += (want.z - camTgt.z)*dampK(12, dt); camTgt.y += (want.y - camTgt.y)*dampK(5, dt); }
  shake = Math.max(0, shake - dt*2.2); shakeV.set((Math.random() - 0.5)*shake*1.6, (Math.random() - 0.5)*shake*1.6, 0);
  const cp = Math.cos(camPit), cd = new V3(Math.sin(camYaw)*cp, Math.sin(camPit), Math.cos(camYaw)*cp), dist = camClip(camTgt, cd, camDist);
  camera.position.set(camTgt.x + cd.x*dist + shakeV.x, camTgt.y + cd.y*dist + shakeV.y, camTgt.z + cd.z*dist);
  camera.lookAt(camTgt.x, camTgt.y + 0.5, camTgt.z);
  key.position.set(camTgt.x + 14, camTgt.y + 28, camTgt.z + 18); key.target.position.copy(camTgt); key.target.updateMatrixWorld(); rim.position.set(camTgt.x - 8, camTgt.y + 6, camTgt.z - 9);
}
function hudUpdate(dt){
  const hp = hudEl.querySelector('#gHp'); hp.style.width = (100*P.hp/P.hpMax) + '%';
  hudEl.querySelector('#gCoins').textContent = P.coins; hudEl.querySelector('#gRel').textContent = P.relics; hudEl.querySelector('#gSt').textContent = P.state;
  if (msgT > 0){ msgT -= dt; if (msgT <= 0) msgEl.textContent = ''; }
  const it = (P.state === 'ground') ? interactNear() : null; promptEl.style.display = it ? 'block' : 'none'; if (it) promptEl.textContent = it.label;
  if (P.state === 'ground'){ const l = ladderNear(); if (l && !it){ promptEl.style.display = 'block'; promptEl.textContent = 'W — лезть по лестнице'; } }
}

/* ───────────── ввод ───────────── */
const GK = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'KeyJ', 'KeyK', 'KeyL', 'KeyF', 'KeyC', 'KeyV', 'KeyE', 'KeyR', 'ShiftLeft', 'ShiftRight', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown']);
addEventListener('keydown', e => { if (GK.has(e.code)){ e.preventDefault(); if (!kd.has(e.code)) pressed.add(e.code); kd.add(e.code); } if (e.code === 'KeyH') helpEl.style.display = helpEl.style.display === 'none' ? '' : 'none'; });
addEventListener('keyup', e => { kd.delete(e.code); });
addEventListener('blur', () => kd.clear());
renderer.domElement.addEventListener('click', () => { if (document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock?.(); });
addEventListener('mousedown', e => { if (document.pointerLockElement !== renderer.domElement) return; if (e.button === 0){ pressed.add('KeyJ'); } if (e.button === 2){ kd.add('KeyK'); pressed.add('KeyK'); } });
addEventListener('mouseup', e => { if (e.button === 2) kd.delete('KeyK'); });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousemove', e => { if (document.pointerLockElement !== renderer.domElement) return; camYaw -= e.movementX*0.0035; camPit = clamp(camPit + e.movementY*0.003, -0.2, 1.2); });
addEventListener('wheel', e => { camDist = clamp(camDist + e.deltaY*0.02, 16, 60); });
window.__g = {P, kd, pressed, enemies, press:c => { kd.add(c); pressed.add(c); }, release:c => kd.delete(c), cam:(y, p, d) => { camYaw = y; camPit = p; if (d) camDist = d; }, step:n => { for (let i = 0; i < n; i++){ gStep(H); camUpdate(H, true); } }};

/* ───────────── запуск ───────────── */
setAnim('Стойка', {fade:0}); mixer.update(0); capeReset();
const evs = (Q.get('gs') || '').split(';').filter(Boolean).map(s => { const [t, a] = s.split(':'); return {t:+t, op:a[0] === ' ' ? '+' : a[0], code:a.slice(1)}; }).sort((a, b) => a.t - b.t);
if (Q.get('gpos')){ const [x, y, z] = Q.get('gpos').split(',').map(Number); P.pos.set(x, y, z); P.spawn.set(x, y, z); }
if (Q.get('gyaw')) { P.yaw = P.yawVis = +Q.get('gyaw'); }
if (Q.get('gcam')){ const [y, p, d] = Q.get('gcam').split(',').map(Number); camYaw = y; camPit = p; camDist = d; }
if (Q.get('hp')) P.hp = +Q.get('hp');
helpEl.style.display = Q.get('hud') === '0' ? 'none' : '';
if (Q.get('hud') === '0'){ hudEl.style.display = 'none'; }
function simTo(tEnd, state = {i:0}){ while (P.simT < tEnd - 1e-6){ while (state.i < evs.length && evs[state.i].t <= P.simT + 1e-6){ const e = evs[state.i++]; if (e.op === '+'){ if (!kd.has(e.code)) pressed.add(e.code); kd.add(e.code); } else kd.delete(e.code); } gStep(H); camUpdate(H, true); } }
const gst = {i:0};
if (Q.get('gdbg')){ const [x, z] = Q.get('gdbg').split(',').map(Number); P.log.push('dbg ground=' + groundAt(x, z, 0, 1.55) + ' n=' + solids.length + ' cover=' + solids.filter(b => x >= b.min.x && x <= b.max.x && z >= b.min.z && z <= b.max.z).map(b => [b.min.y, b.max.y].join('..')).join('|')); }
if (Q.get('gshots')){
  const ts = Q.get('gshots').split(',').map(Number), cols = +(Q.get('gcols') || 4), rows = Math.ceil(ts.length/cols), cw = Math.floor(innerWidth/cols), ch = Math.floor(innerHeight/rows);
  renderer.setPixelRatio(1); renderer.setSize(cw, ch); camera.aspect = cw/ch; camera.updateProjectionMatrix(); renderer.domElement.style.display = 'none';
  const out = document.createElement('canvas'); out.width = innerWidth; out.height = innerHeight; Object.assign(out.style, {position:'fixed', left:0, top:0, zIndex:5}); document.body.append(out);
  const g2 = out.getContext('2d'); [hudEl, helpEl, msgEl, promptEl].forEach(e => e.style.display = 'none');
  ts.forEach((tk, k) => { simTo(tk, gst); camUpdate(0.016, true); capeUpload(); renderer.render(scene, camera); const cx = (k % cols)*cw, cy = Math.floor(k/cols)*ch;
    g2.fillStyle = '#cfe0ea'; g2.fillRect(cx, cy, cw, ch); g2.drawImage(renderer.domElement, cx, cy); g2.fillStyle = '#222'; g2.font = '13px sans-serif'; g2.fillText(`t=${tk.toFixed(2)} ${P.state} y=${P.pos.y.toFixed(1)} hp=${P.hp}`, cx + 6, cy + 16); });
  const pre = document.createElement('pre'); pre.id = 'glog'; pre.textContent = P.log.join('\n') + '\nEND ' + JSON.stringify({pos:P.pos.toArray().map(v => +v.toFixed(2)), state:P.state, hp:P.hp, coins:P.coins, cape:window.__cape(), hangH:HANG_H}); document.body.append(pre);
  window.READY = true;
} else {
  if (Q.get('gt')) simTo(+Q.get('gt'), gst);
  camUpdate(0, true); let last = performance.now();
  renderer.setAnimationLoop(now => { const dt = Math.min((now - last)/1000, 0.05); last = now; acc += dt; let n = 0; while (acc >= H && n++ < 6){ gStep(H); acc -= H; } camUpdate(dt); hudUpdate(dt); capeUpload(); renderer.render(scene, camera); window.READY = true; });
}
}

/* ───────────── start ───────────── */
$('loading').remove();
if (Q.get('skel') === '1'){ skel.visible = true; $('skel').checked = true; }
function runSheet(){ // раскадровка: N кадров клипа в одной картинке (каждая ячейка копируется в 2D-холст)
  const name = Q.get('sheet'), clip = CLIPS[name], cols = +(Q.get('cols') || 4);
  const ts = Q.get('ts') ? Q.get('ts').split(',').map(Number) : Array.from({length:+(Q.get('n') || 8)}, (_, k) => clip.duration*k/(+(Q.get('n') || 8)));
  const rows = Math.ceil(ts.length/cols), cw = Math.floor(innerWidth/cols), ch = Math.floor(innerHeight/rows);
  renderer.setPixelRatio(1); renderer.setSize(cw, ch); camera.aspect = cw/ch; camera.updateProjectionMatrix();
  renderer.domElement.style.display = 'none';
  const out = document.createElement('canvas'); out.width = innerWidth; out.height = innerHeight;
  Object.assign(out.style, {position:'fixed', left:0, top:0, zIndex:5}); document.body.append(out);
  const g = out.getContext('2d');
  seek(name, 0);
  let st = 0, mx = {max:0, bad:0};
  ts.forEach((tk, k) => {
    while (st < tk - 1e-6){ advance(H); st += H; }
    capeUpload(); skelUpdate();
    renderer.render(scene, camera);
    const cx = (k % cols)*cw, cy = Math.floor(k/cols)*ch;
    g.fillStyle = '#e8e5dd'; g.fillRect(cx, cy, cw, ch); g.drawImage(renderer.domElement, cx, cy);
    g.fillStyle = '#555'; g.font = '14px sans-serif'; g.fillText('t=' + tk.toFixed(2), cx + 8, cy + 18);
    const c = window.__cape(); mx = {max:Math.max(mx.max, c.max), bad:mx.bad + c.bad};
  });
  const r = document.createElement('pre'); r.id = 'simres'; r.textContent = JSON.stringify(mx); document.body.append(r);
  window.READY = true;
}
if (Q.has('game')) startGame();
else if (Q.has('sheet')) runSheet();
else {
  play(Q.get('clip') || 'Стойка', 0);
  mixer.update(0); figure.updateMatrixWorld(true); capeReset();
  if (Q.has('clip') && Q.has('t')) seek(Q.get('clip'), +Q.get('t'));
  else for (let i = 0; i < 90; i++) advance(H);
  if (Q.get('sim')){ const r = document.createElement('pre'); r.id = 'simres'; r.textContent = JSON.stringify(window.__run(+Q.get('sim'))); document.body.append(r); }
  if (Q.has('t')) paused = true;
  if (Q.get('export')){
    buildGLB().then(buf => {
      let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i+0x8000));
      const pre = document.createElement('pre'); pre.id = 'glb64'; pre.textContent = btoa(s); document.body.append(pre);
    }).catch(e => { const pre = document.createElement('pre'); pre.id = 'glberr'; pre.textContent = String(e && e.stack || e); document.body.append(pre); });
  }
  let last = performance.now();
  renderer.setAnimationLoop(now => { const dt = (now - last)/1000; last = now; frame(dt); controls.update(); renderer.render(scene, camera); window.READY = true; });
}
</script>
