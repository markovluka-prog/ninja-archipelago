<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { buildMap } from './build-map.js';
import { createAnimals } from './animals.js';
import { loadRichard } from './richard-mode.js';
import { createNPCs } from './npcs.js';
import { startNetwork } from './network.js';
import { startLobby } from './lobby.js';
import { startChat } from './chat.js';
import { startGame } from './game.js';
import { startMinimap } from './minimap.js';
import { createSky } from './sky.js';

const Q = new URLSearchParams(location.search);
if (Q.get('hud') === '0') document.body.classList.add('nohud');
const $ = id => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });      // логарифмический буфер глубины: убирает мерцание (z-fighting) на близких поверхностях при near 0.4 / far 14000

renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const SKY = new THREE.Color(0xa9d6ea);
const scene = new THREE.Scene(); scene.background = SKY; scene.fog = new THREE.Fog(SKY, 500, 2400);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.4, 14000);
const hemi = new THREE.HemisphereLight(0xe3f3ff, 0x6a7a55, 1.0); scene.add(hemi);

sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -180, right: 180, top: 180, bottom: -180, near: 10, far: 700 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.08; scene.add(sun, sun.target);

const controls = new OrbitControls(camera, renderer.domElement);

camera.position.set(0, 1800, 2300); controls.update();

const say = (m, p) => { $('lmsg').textContent = m; $('lbar').style.width = (p * 100) + '%'; };
let world, animals, npcs = { count: 0, update() {} }, richard, mode = 'orbit';
try {
  world = await buildMap({ THREE, mergeGeometries, scene, base: './', onProgress: say });
  say('Заселяю животных…', 0.95);
  animals = createAnimals({ THREE, scene, world, base: './' });
  say('Расселяю жителей…', 0.96);
  try { npcs = await createNPCs({ scene, world, base: './' }); } catch (e) { console.error('NPC не загрузились', e); }
  const startPt = world.startSpot;
  say('Собираю Ричарда…', 0.97);
  try { richard = await loadRichard({ renderer, scene, camera, world, url: new URL('Ричард/3D/richard.html', location.href).href, start: startPt }); }
  catch (e) { console.error('Ричард не загрузился', e); }
  world.richardStart = startPt;
  camera.far = 14000; camera.near = 0.4; camera.updateProjectionMatrix(); scene.fog = new THREE.Fog(SKY, 500, 2400); scene.background = SKY;   // Ричард ставит свой туман/дальность
} catch (e) { console.error(e); $('lmsg').textContent = 'Ошибка: ' + e.message + ' (откройте страницу через локальный сервер: python3 -m http.server)'; throw e; }
$('stat').textContent = `${world.stats.placements} объектов · ${animals.count} животных · ${npcs.count} жителей`;
const net = startNetwork({ richard, scene, THREE, onStatus: t => { const el = $('netStat'); if (el) el.textContent = t; } });      // игра вдвоём (сервер: node server.js)
window.CAM = camera; window.CTRL = controls; window.NET = net; window.SCENE = scene; window.WORLD = world; window.RICHARD = richard; window.ANIMALS = animals;

/* день и ночь: t ∈ [0,1): 0.25 — рассвет, 0.5 — полдень, 0.75 — закат, 0/1 — полночь */
const tod = { t: 0.42, auto: true, len: 360 };      // полные сутки = 6 минут
const C_DAY = new THREE.Color(0xa9d6ea), C_NIGHT = new THREE.Color(0x0a1428), C_WARM = new THREE.Color(0xf0925a), C_SUN = new THREE.Color(0xfff1d6), C_SUNW = new THREE.Color(0xffa860), cc = new THREE.Color();
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
let dayF = 1;
const sky = createSky(THREE, scene);      // солнце, луна, облака
function applyTod() {
  const ang = (tod.t - 0.25) * Math.PI * 2, el = Math.sin(ang), f = sm(-0.12, 0.28, el), warm = Math.exp(-(((el - 0.02) / 0.2) ** 2)) * 0.6;
  dayF = f; world.tod = { t: tod.t, phase: tod.t < 0.24 || tod.t >= 0.80 ? 'night' : tod.t >= 0.70 ? 'eve' : 'day' };      // жители и животные живут по расписанию: день — работа, вечер — домой, ночь — сон
  cc.copy(C_NIGHT).lerp(C_DAY, f).lerp(C_WARM, warm * (1 - 0.3 * f)); SKY.copy(cc); scene.background = SKY; if (scene.fog) scene.fog.color.copy(cc);
  hemi.intensity = 0.16 + 0.84 * f; renderer.toneMappingExposure = 0.55 + 0.45 * f;
  sun.color.copy(C_SUN).lerp(C_SUNW, warm); sun.intensity = mode === 'walk' ? 0 : 2.4 * f;
  sun.userData.dir = [Math.cos(ang) * 0.9, Math.max(0.12, el), 0.45];
  if (richard && richard.key) { richard.key.intensity = 2.3 * (0.12 + 0.88 * f); richard.rim.intensity = 1.0 * (0.2 + 0.8 * f); richard.key.color.copy(C_SUN).lerp(C_SUNW, warm); }
  sky.update(camera, ang, el, f, warm);
  const h = ((tod.t * 24) + 24) % 24; $('todT').textContent = String(Math.floor(h)).padStart(2, '0') + ':' + String(Math.floor((h % 1) * 60)).padStart(2, '0') + (world.tod.phase === 'night' ? ' · ночь: все спят' : world.tod.phase === 'eve' ? ' · вечер: идут домой' : el < 0.3 ? ' · утро: идут на работу' : ' · день: работа');
}
$('tod').oninput = e => { tod.t = +e.target.value; applyTod(); };
$('todAuto').onclick = () => { tod.auto = !tod.auto; $('todAuto').textContent = '⏯ Смена дня: ' + (tod.auto ? 'вкл' : 'выкл'); };

/* телепорты */
const spotsEl = $('spots');
const goTo = (name) => {
  if (window.__gameLock) return;      // телепорт выключен во время режима
  const s = world.spots[name]; if (!s) return;
  if (mode === 'walk' && richard) richard.teleport(s.x, s.z, s.yaw);
  else { controls.target.set(s.x, world.heightAt(s.x, s.z), s.z); camera.position.set(s.x + 90, world.heightAt(s.x, s.z) + 80, s.z + 110); controls.update(); }
};
for (const n of Object.keys(world.spots)) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => goTo(n); spotsEl.appendChild(b); }
$('tog').onclick = () => { $('ui').classList.toggle('min'); $('tog').textContent = $('ui').classList.contains('min') ? '+' : '–'; };

/* режимы */
function setMode(m, quiet) {
  if (m === 'orbit' && window.__gameLock && richard && net.me && net.me.play) m = 'walk';      // в режиме игры облёт карты выключен
  if (m === 'walk' && (!richard || !(net.me && net.me.play))) m = 'orbit';      // гулять можно только добавив себя в игру (меню M)
  mode = m; $('bWalk').classList.toggle('on', m === 'walk'); $('bOrbit').classList.toggle('on', m === 'orbit');
  controls.enabled = m === 'orbit';
  scene.fog.near = m === 'orbit' ? 7000 : 500; scene.fog.far = m === 'orbit' ? 16000 : 2400;
  if (richard) richard.active = m === 'walk';
  sun.castShadow = m !== 'walk'; applyTod();
  if (m === 'orbit') {
    const p = richard ? richard.P.pos : { x: 0, y: 0, z: 0 };
    controls.target.set(p.x, p.y, p.z); camera.position.set(p.x + 140, p.y + 120, p.z + 170); camera.fov = 50; camera.updateProjectionMatrix(); controls.update();
    $('hint').textContent = 'Облёт: мышь — вращение, колесо — зум, ПКМ — сдвиг · G — к Ричарду';
  } else $('hint').textContent = 'Клик по сцене — захват мыши · WASD бег · Пробел прыжок · J удар · K блок · C перекат · V скольжение · E взаимодействие и двери домов · G облёт · T телепорт · H справка';
}
$('bWalk').onclick = () => setMode('walk'); $('bOrbit').onclick = () => setMode('orbit');
addEventListener('keydown', e => { if (e.code === 'KeyG') { if (document.pointerLockElement) document.exitPointerLock(); setMode(mode === 'walk' ? 'orbit' : 'walk'); } });
setMode('orbit');      // в игру попадают только через меню лобби (lobby.js)
// персонаж: Ричард / Соколин (клавиша B — в richard-mode.js; меняет только внешний вид, позиция и камера сохраняются)
let lobby = null;
$('bChar').onclick = () => lobby && lobby.open();
addEventListener('richardcharacter', e => { $('bChar').textContent = '👥 Меню игроков (M) · ' + e.detail; });
startChat({ net, getName: () => net.lobby ? (net.lobby.name || 'Игрок') : 'Игрок' });      // чат: Enter
let gameMode = null;
      // режимы игры
if (richard) lobby = startLobby({ net, richard, world, setMode, getMode: () => mode });
if (Q.get('at')) goTo(Q.get('at'));
if (Q.get('cam')) { const [x, y, z, tx, ty, tz] = Q.get('cam').split(',').map(Number); camera.position.set(x, y, z); controls.target.set(tx, ty, tz); controls.update(); }

/* телепортация: карта-миникарта; клик — переносит туда (в режиме Ричарда — на ближайшую свободную сушу), 1–9 — быстрые места */
{
  const tp = $('tp'), cv = $('tpmap'), g2 = cv.getContext('2d'), CW = cv.width, CH = cv.height, WW = world.size.W, WH = world.size.H;
  const names = Object.keys(world.spots), toW = (px, py) => [(px / CW - 0.5) * WW, (py / CH - 0.5) * WH], toP = (x, z) => [(x / WW + 0.5) * CW, (z / WH + 0.5) * CH];
  let baked = null;
  const bake = () => {
    const im = g2.createImageData(CW, CH), d = im.data;
    for (let py = 0; py < CH; py += 2) for (let px = 0; px < CW; px += 2) {
      const [x, z] = toW(px, py), h = world.heightAt(x, z); let r, g, b;
      if (h < 0) { const t = Math.min(1, -h / 14); r = 80 - 60 * t; g = 150 - 90 * t; b = 200 - 60 * t; }
      else if (h < 0.8) { r = 232; g = 212; b = 155; }
      else if (h < 14) { const t = h / 14; r = 120 - 30 * t; g = 175 - 40 * t; b = 85 - 10 * t; }
      else if (h < 30) { r = 130; g = 122; b = 110; } else { r = 240; g = 244; b = 248; }
      for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) { const k = ((py + j) * CW + px + i) * 4; d[k] = r; d[k + 1] = g; d[k + 2] = b; d[k + 3] = 255; }
    }
    baked = im;
  };
  /* вкладка «Жители»: зона (круг), маршрут (линия; замкнутый — кругом, «путь» — туда-обратно), точки с действиями, дом (пунктир) и текущее положение каждого жителя */
  let tab = 'tp'; const hidden = new Set(); let infos = [], hoverN = null;
  const hue = id => { const ids = [...new Set(infos.map(n => n.id))].sort(); return 'hsl(' + (ids.indexOf(id) * 47 % 360) + ',72%,42%)'; };
  const RU = { horse: ['Лошадь', '🐎'], palfrey: ['Верховая лошадь', '🐴'], 'draft-horse': ['Тяжеловоз', '🐴'], donkey: ['Осёл', '🐴'], ox: ['Вол', '🐂'], bull: ['Бык', '🐂'], cow: ['Корова', '🐄'], pig: ['Свинья', '🐖'], boar: ['Кабан', '🐗'], sheep: ['Овца', '🐑'], goat: ['Коза', '🐐'], dog: ['Собака', '🐕'], cat: ['Кошка', '🐈'], wolf: ['Волк', '🐺'], hen: ['Курица', '🐔'], rooster: ['Петух', '🐓'], goose: ['Гусь', '🦢'], duck: ['Утка', '🦆'], dove: ['Голубь', '🕊️'], raven: ['Ворон', '🐦'], falcon: ['Сокол', '🦅'] };
  let ainfos = [];
  const ahue = sp => 'hsl(' + ([...new Set(ainfos.map(a => a.sp))].sort().indexOf(sp) * 41 % 360) + ',70%,40%)';
  const drawAni = () => {
    ainfos = animals.info();
    for (const a of ainfos) {
      if (hidden.has('a:' + a.sp)) continue; const col = ahue(a.sp);
      g2.strokeStyle = col; g2.fillStyle = col.replace('hsl', 'hsla').replace(')', ',0.10)'); g2.lineWidth = 1.6;
      if (a.orbit) { const [cx, cy] = toP(a.orbit.cx, a.orbit.cz); g2.setLineDash([6, 4]); g2.beginPath(); g2.arc(cx, cy, a.orbit.r / WW * CW, 0, 7); g2.fill(); g2.stroke(); g2.setLineDash([]); continue; }
      if (!a.route) continue; const pts = a.route.map(p => toP(p[0], p[1]));
      const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cy = pts.reduce((s, p) => s + p[1], 0) / pts.length, r = Math.max(...pts.map(p => Math.hypot(p[0] - cx, p[1] - cy))) + 5;
      if (a.mode !== 'route') { g2.setLineDash([4, 4]); g2.beginPath(); g2.arc(cx, cy, r, 0, 7); g2.fill(); g2.stroke(); g2.setLineDash([]); }
      g2.lineWidth = a === hoverN ? 3.5 : 1.8; g2.beginPath(); pts.forEach((p, i) => i ? g2.lineTo(p[0], p[1]) : g2.moveTo(p[0], p[1])); if (a.mode === 'loop' || a.mode === 'swim') g2.closePath(); g2.stroke();
    }
    for (const a of ainfos) { if (hidden.has('a:' + a.sp)) continue; const [px, py] = toP(a.x, a.z); g2.fillStyle = '#fff'; g2.strokeStyle = ahue(a.sp); g2.lineWidth = 1.5; g2.beginPath(); g2.arc(px, py, 7, 0, 7); g2.fill(); g2.stroke(); g2.font = '10px sans-serif'; g2.fillStyle = '#000'; g2.textAlign = 'center'; g2.fillText(RU[a.sp][1], px, py + 1); g2.textAlign = 'left'; }
  };
  const ACT = { work: 'работа', talk: 'разговор', idle: 'отдых' };
  const drawNpc = () => {
    infos = npcs.info ? npcs.info() : [];
    for (const n of infos) {
      if (hidden.has(n.id)) continue;
      const col = hue(n.id), pts = n.route.map(p => toP(p[0], p[1]));
      const cx = pts.reduce((a, p) => a + p[0], 0) / pts.length, cy = pts.reduce((a, p) => a + p[1], 0) / pts.length, r = Math.max(...pts.map(p => Math.hypot(p[0] - cx, p[1] - cy))) + 6;
      g2.fillStyle = col.replace('hsl', 'hsla').replace(')', ',0.10)'); g2.strokeStyle = col.replace('hsl', 'hsla').replace(')', ',0.45)'); g2.lineWidth = 1.5; g2.setLineDash([5, 4]);
      g2.beginPath(); g2.arc(cx, cy, r, 0, 7); g2.fill(); g2.stroke(); g2.setLineDash([]);
      g2.strokeStyle = col; g2.lineWidth = n === hoverN ? 4 : 2; g2.beginPath(); pts.forEach((p, i) => i ? g2.lineTo(p[0], p[1]) : g2.moveTo(p[0], p[1])); if (n.mode === 'loop') g2.closePath(); g2.stroke();
      pts.forEach((p, i) => { g2.fillStyle = n.acts && n.acts[i] === 'work' ? '#fff' : n.acts && n.acts[i] === 'talk' ? '#ffe28a' : col; g2.strokeStyle = col; g2.lineWidth = 2; g2.beginPath(); g2.arc(p[0], p[1], 3.2, 0, 7); g2.fill(); g2.stroke(); });

const onDeck = (v, p) => Math.abs(p.y - deckWorldY(v)) < 1.4 && v.deckBoxes.some(b => p.x > b.min.x - 0.3 && p.x < b.max.x + 0.3 && p.z > b.min.z - 0.3 && p.z < b.max.z + 0.3);
function sailShips(dt) {          // корабли без рулевого: если паруса подняты — продолжают плыть; стоящие на палубе едут вместе с ними
  const P = richard.P;
  for (const v of ships) {
    if (riding && riding.kind === 'ship' && riding.v === v) continue;
    if (v.remote || v.frozen || v.sunk) continue;      // чужие корабли в сетевом режиме двигает их хозяин
    if (!(v.sailsUp || Math.abs(v.rv) > 0.05)) continue;
    const ox = v.g.position.x, oz = v.g.position.z, oy = v.yaw, carry = onDeck(v, P.pos) && !riding;
    stepShip(v, dt, 0, false);
    if (carry) { const th = v.yaw - oy, rx = P.pos.x - ox, rz = P.pos.z - oz; P.pos.x = v.g.position.x + rx * Math.cos(th) + rz * Math.sin(th); P.pos.z = v.g.position.z - rx * Math.sin(th) + rz * Math.cos(th); }
  }
}
function rideUpdate(dt) {
  const P = richard.P, fwd = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0), turn = (keys.has('KeyA') ? 1 : 0) - (keys.has('KeyD') ? 1 : 0), run = keys.has('ShiftLeft') || keys.has('ShiftRight');
  sailShips(dt);
  if (!riding) {
    const c = animals.nearRideable(P.pos.x, P.pos.z, 9), bt = c ? null : nearBoat(P.pos), h = c || bt ? null : nearHelm(P.pos), l = c || bt || h || P.state !== 'swim' ? null : richard.ladderNear();
    rideEl.style.display = (c || bt || h || l) && !P.dead ? 'block' : 'none';
    rideEl.textContent = bt ? 'E — сесть в лодку' : c ? (animals.controllable(c) ? 'E — сесть на лошадь (с седлом: можно управлять)' : 'E — сесть (без седла: лошадь идёт сама)') : h ? 'E — встать к штурвалу (плыть можно только отсюда)' : l ? 'W — лезть по лестнице на борт' : '';
    return;
  }
  const r = riding; rideEl.style.display = 'block';
  if (r.kind === 'horse') {
    const c = r.c;
    if (r.stage === 'mount') {
      r.t += dt; const u = Math.min(1, r.t / 1.1), e = easeN(u), s = animals.seat(c);
      setPos(P, lerpN(r.from.x, s.x, e), lerpN(r.from.y, s.y - SEAT_DROP, e) + Math.sin(Math.PI * u) * 2.2, lerpN(r.from.z, s.z, e), angLerp(r.yaw0, s.yaw, e));
      rideEl.textContent = '';
      if (u >= 1) { r.stage = 'ride'; r.cur = 'Верхом'; richard.play('Верхом', { fade: 0.2 }); }
    } else if (r.stage === 'ride') {
      const ctl = animals.controllable(c); if (ctl) animals.rideStep(c, fwd, turn, run, dt); const s = animals.seat(c);
      setPos(P, s.x, s.y - SEAT_DROP, s.z, s.yaw);
      if (r.atk > 0) { r.atk -= dt; if (r.atk <= 0) r.cur = ''; }      // идёт удар с лошади — позу «Верхом» не навязываем
      else { const want = c.jy > 0.3 ? 'ВерхомПрыжок' : 'Верхом'; if (r.cur !== want) { r.cur = want; richard.play(want, { fade: 0.12 }); } }
      rideEl.textContent = ctl ? 'W/S · A/D · Shift — галоп · Пробел — прыжок · E — слезть' : 'Лошадь без седла не слушается — она идёт сама · E — слезть';
    } else {
      r.t += dt; const u = Math.min(1, r.t / 0.6), e = easeN(u);
      setPos(P, lerpN(r.from.x, r.to.x, e), lerpN(r.from.y, r.to.y, e) + Math.sin(Math.PI * u) * 2.5, lerpN(r.from.z, r.to.z, e), angLerp(r.yaw0, r.yaw0, 0));
      if (u >= 1) { richard.release(); dropSup(); P.pos.set(r.to.x, r.to.y, r.to.z); setRiding(null); }
    }
    return;
  }
  // корабль: штурвал
  rideEl.textContent = 'Q — ' + (r.v.sailsUp ? 'спустить паруса (встать)' : 'поднять паруса (плыть)') + ' · A/D — поворот · Shift — быстрее · E — оставить штурвал (при поднятых парусах корабль поплывёт сам)';
  const v = r.v; stepShip(v, dt, turn, run);
  const h = wp(v, v.helm.x, v.helm.y, v.helm.z); P.pos.set(h.x, deckWorldY(v) + 0.02, h.z); P.vel.set(0, 0, 0); P.yaw = P.yawVis = v.yaw;
}

for (const v of ships) v.init = { x: v.g.position.x, z: v.g.position.z, yaw: v.yaw, y0: v.y0 };
const shipsApi = {                    // для режима «Морской бой» (game.js): корабли, их позы, посадка на штурвал, потопление
  list: ships,
  setPose(v, x, z, yaw) { v.g.position.x = x; v.g.position.z = z; v.yaw = yaw; v.g.rotation.y = yaw; placeDeck(v); },
  reset() { for (const v of ships) { v.remote = v.frozen = v.sunk = false; v.sailsUp = false; v.rv = 0; v.heel = 0; v.y0 = v.init.y0; v.g.visible = true; this.setPose(v, v.init.x, v.init.z, v.init.yaw); } },
  freeze(v, on) { v.frozen = on; if (on) { v.sailsUp = false; v.rv = 0; } },
  board(v) { const P = richard.P, h = wp(v, v.helm.x, v.helm.y, v.helm.z); P.pos.set(h.x, deckWorldY(v) + 0.05, h.z); P.vel.set(0, 0, 0); v.rv = 0; setRiding({ kind: 'ship', v }); },
  release() { if (riding && riding.kind === 'ship') setRiding(null); },
  riding: () => (riding && riding.kind === 'ship' ? riding.v : null),
  sink(v, dt) { v.sunk = true; v.sailsUp = false; v.y0 = Math.max(v.y0 - 1.7 * dt, -16); v.heel += (0.5 - v.heel) * Math.min(1, dt * 0.6); placeDeck(v); if (v.y0 <= -15) v.g.visible = false; },
};
if (richard) gameMode = startGame({ net, richard, world, scene, THREE, ships: shipsApi });
if (richard) startMinimap({ world, net, richard, getGame: () => gameMode && gameMode.state, getMode: () => mode });      // миникарта: где второй игрок (N — размер)

/* цикл */
const clock = new THREE.Clock(); let T = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min(clock.getDelta(), 0.1); T += dt;
  if (tod.auto) { tod.t = (tod.t + dt / tod.len) % 1; $('tod').value = tod.t; } applyTod();
  net.update(dt); if (gameMode) gameMode.update(dt); sailsTick(dt); world.update(T); animals.update(T, dt, camera.position, camera); npcs.update(dt, camera.position, camera);
  if (mode === 'walk' && richard) {
    const p = richard.P.pos;                                  // животные и жители твёрдые: выталкиваем Ричарда
    rideUpdate(dt);
    for (const b of riding ? [] : [...animals.bodies(), ...(npcs.bodies ? npcs.bodies() : []), ...net.bodies()]) {
      if (Math.abs(p.y - b.y) > 6) continue;
      const dx = p.x - b.x, dz = p.z - b.z, d = Math.hypot(dx, dz), m = b.r + 1.1;
      if (d < m) { const k = d > 1e-3 ? m / d : 0; if (k) { p.x = b.x + dx * k; p.z = b.z + dz * k; } else p.x += m; }
    }
    richard.loop(now);
  }
  else {
    controls.update();
    const sd = sun.userData.dir || [0.5, 1, 0.4]; sun.position.set(controls.target.x + sd[0] * 240, controls.target.y + sd[1] * 240, controls.target.z + sd[2] * 240); sun.target.position.copy(controls.target); sun.target.updateMatrixWorld();
    renderer.render(scene, camera);
  }
  window.READY = true;
});
</script>
