<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Растения — предпросмотр</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8f0;font:13px system-ui,sans-serif}
canvas{display:block}
#hud{position:fixed;left:10px;top:10px;background:#fffc;padding:8px 10px;border-radius:8px;z-index:5}
#hud button{font:inherit;padding:3px 8px;margin-right:6px}
.lbl{position:fixed;transform:translate(-50%,0);background:#000a;color:#fff;padding:1px 6px;border-radius:4px;font-size:11px;white-space:nowrap;pointer-events:none}
#stats{position:fixed;left:0;bottom:0;margin:0;font-size:1px;color:transparent;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="hud"><button id="shuffle">Перемешать seed</button>seed: <b id="seedv">0</b> <label><input type="checkbox" id="anim" checked> анимация</label></div>
<div id="labels"></div><pre id="stats"></pre>
<script>addEventListener("error",e=>{document.getElementById("stats").textContent+="ERR "+e.message+"\n"});addEventListener("unhandledrejection",e=>{document.getElementById("stats").textContent+="REJ "+(e.reason&&e.reason.stack||e.reason)+"\n"});</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MODELS } from './models.js';
const q = new URLSearchParams(location.search);
const only = q.get('only') ? q.get('only').split(',') : null;
const hud = q.get('hud') !== '0', showRef = q.get('ref') !== '0';
let seed = +(q.get('seed') || 0);
const list = only ? MODELS.filter(m => only.includes(m.id)) : MODELS;
const cols = +(q.get('cols') || (list.length === 1 ? 1 : 6));
if (!hud) document.getElementById('hud').style.display = 'none';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfe8f0);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 3000);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xfff4dc, 0x6ea848, 0.9));
const sun = new THREE.DirectionalLight(0xfff0d0, 2.2); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: 0x6ea848, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const holder = new THREE.Group(); scene.add(holder);
const labelsEl = document.getElementById('labels');
let items = [], bounds = new THREE.Box3();

function build() {
  holder.clear(); labelsEl.innerHTML = ''; items = [];
  const gap = 5, rows = [];
  list.forEach((m, i) => {
    const g = m.make(THREE, seed); const b = new THREE.Box3().setFromObject(g, true), sz = b.getSize(new THREE.Vector3());
    let tris = 0; g.traverse(o => { if (o.isMesh) { const gg = o.geometry; tris += (gg.index ? gg.index.count : gg.attributes.position.count) / 3; } });
    const r = Math.floor(i / cols); (rows[r] = rows[r] || []).push({ m, g, b, sz, tris });
  });
  let z = 0; const stats = [];
  rows.forEach((row, ri) => {
    const depth = Math.max(...row.map(it => it.sz.z)); let x = 0;
    const cw = row.map(it => Math.max(it.sz.x, 6) + gap);
    const total = cw.reduce((a, c) => a + c, 0);
    if (ri === 0 && showRef) { const f = ref(); f.position.set(-total / 2 - 6, 0, z); holder.add(f); }
    x = -total / 2;
    row.forEach((it, k) => {
      const cx = x + cw[k] / 2, cxo = (it.b.min.x + it.b.max.x) / 2;
      it.g.position.set(cx - cxo * 0 , 0, z + depth / 2 - ((it.b.min.z + it.b.max.z) / 2) * 0);
      it.g.position.x = cx; holder.add(it.g);
      items.push({ it, pos: new THREE.Vector3(cx, 0, z + depth / 2 + it.sz.z / 2 + 1), el: null });
      const el = document.createElement('div'); el.className = 'lbl'; el.textContent = it.m.id + ' — ' + it.m.name; if (!hud) el.style.display = 'none'; labelsEl.appendChild(el); items[items.length - 1].el = el;
      stats.push(`${it.m.id}\t${it.sz.x.toFixed(1)}x${it.sz.y.toFixed(1)}x${it.sz.z.toFixed(1)}\tminY=${it.b.min.y.toFixed(2)}\ttris=${it.tris}\tanim=${!!it.g.userData.animate}`);
      x += cw[k];
    });
    z += depth + gap + 8;
  });
  document.getElementById('stats').textContent = stats.join('\n');
  document.getElementById('seedv').textContent = seed;
  bounds.setFromObject(holder);
  const c = bounds.getCenter(new THREE.Vector3()), sph = bounds.getBoundingSphere(new THREE.Sphere());
  const rad = sph.radius;
  const half = Math.atan(Math.tan(THREE.MathUtils.degToRad(20)) * Math.min(1, camera.aspect));
  const dist = Math.max(rad / Math.sin(half) * 0.8, 20);
  const el = THREE.MathUtils.degToRad(+(q.get('el') || 38)), az = THREE.MathUtils.degToRad(+(q.get('az') || 0));
  c.y *= 0.6; controls.target.copy(c);
  camera.position.set(c.x + Math.sin(az) * Math.cos(el) * dist, c.y + Math.sin(el) * dist, c.z + Math.cos(az) * Math.cos(el) * dist);
  camera.far = dist * 5; camera.updateProjectionMatrix();
  const sh = sun.shadow.camera, e = rad * 1.1;
  sh.left = -e; sh.right = e; sh.top = e; sh.bottom = -e; sh.near = 1; sh.far = rad * 6; sh.updateProjectionMatrix();
  sun.position.set(c.x - rad * 0.8, rad * 2, c.z + rad * 1.2); sun.target.position.copy(c);
}
function ref() { // условный персонаж 6.5
  const g = new THREE.Group(), m = new THREE.MeshStandardMaterial({ color: 0x3a4a7a });
  const b = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.2, 4.2, 10), m); b.position.y = 2.1; b.castShadow = true;
  const h = new THREE.Mesh(new THREE.SphereGeometry(1.15, 12, 8), new THREE.MeshStandardMaterial({ color: 0xf0c8a0 })); h.position.y = 5.35; h.castShadow = true;
  g.add(b, h); return g;
}
document.getElementById('shuffle').onclick = () => { seed = Math.floor(Math.random() * 9999); build(); };
build();
const clock = new THREE.Clock(); const v = new THREE.Vector3();
const fixedT = q.get('t');
function loop() {
  requestAnimationFrame(loop);
  const t = fixedT !== null ? +fixedT : clock.getElapsedTime();
  if (document.getElementById('anim').checked || fixedT !== null) holder.traverse(o => { if (o.userData.animate) o.userData.animate(t); });
  controls.update(); renderer.render(scene, camera);
  if (hud) for (const l of items) { v.copy(l.pos).project(camera); l.el.style.left = (v.x * 0.5 + 0.5) * innerWidth + 'px'; l.el.style.top = (-v.y * 0.5 + 0.5) * innerHeight + 'px'; l.el.style.display = v.z < 1 ? '' : 'none'; }
}
loop();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
</script></body></html>
