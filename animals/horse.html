<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лошадь — средневековый дестриер</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfd6d2;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  canvas{display:block}
  #ui{position:fixed;left:0;right:0;top:0;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
      background:linear-gradient(#1c1a18cc,#1c1a1800);color:#f2ece0;pointer-events:none}
  #ui>*{pointer-events:auto}
  h1{font-size:20px;margin:0 12px 0 0;font-weight:600;letter-spacing:.2px}
  button{font:inherit;font-size:14px;color:#f2ece0;background:#3b322b;border:1px solid #6b5a4a;border-radius:6px;padding:6px 12px;cursor:pointer}
  button:hover{background:#4d4036}
  button.on{background:#9a6a3a;border-color:#d3a56a;color:#fff}
  label{font-size:13px;display:flex;align-items:center;gap:8px}
  input[type=range]{width:130px}
  #info{position:fixed;left:16px;bottom:10px;color:#2d2924;font-size:12px;opacity:.75}
</style>
</head>
<body>
<div id="ui">
  <h1>Лошадь — средневековый дестриер</h1>
  <span id="clips"></span>
  <label>Скорость <input id="speed" type="range" min="0.1" max="2.5" step="0.05" value="1"><span id="sv">1.0×</span></label>
  <button id="play">Пауза</button>
  <button id="reset">Сброс</button>
</div>
<div id="info">Мышь: вращение / масштаб / панорама</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfd6d2);
scene.fog = new THREE.Fog(0xcfd6d2, 14, 40);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.1, 100);
const CAM0 = new THREE.Vector3(3.9, 1.9, 4.2), TGT0 = new THREE.Vector3(0.15, 0.95, 0);
camera.position.copy(CAM0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TGT0); controls.enableDamping = true; controls.maxPolarAngle = Math.PI*0.49;
controls.minDistance = 1.5; controls.maxDistance = 14; controls.update();

const key = new THREE.DirectionalLight(0xfff0dd, 2.6);
key.position.set(4,6.5,3.5); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.radius = 5; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera,{left:-3.2,right:3.2,top:3.2,bottom:-3.2,near:1,far:20});
scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd0ff, 0.7); fill.position.set(-5,3,2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.2); rim.position.set(-2,4,-6); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x6b6a4a, 0.35));

/* ---------- procedural textures ---------- */
function rnd(seed){let s=seed;return()=>((s=Math.imul(s^s>>>15,2246822507)+1013904223|0)>>>0)/4294967296;}
function noiseTex(hex, amp=0.12, scale=1, seed=1, streak=false){
  const N=256, c=document.createElement('canvas'); c.width=c.height=N; const g=c.getContext('2d');
  const base=new THREE.Color(hex); const r=rnd(seed);
  g.fillStyle='#'+base.getHexString(); g.fillRect(0,0,N,N);
  const img=g.getImageData(0,0,N,N), d=img.data;
  // value noise, tileable via wrapping grid
  const G=16, grid=[]; for(let i=0;i<G*G;i++) grid.push(r());
  const sm=t=>t*t*(3-2*t);
  const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),fx=sm(x-xi),fy=sm(y-yi);
    const a=grid[(yi%G)*G+(xi%G)],b=grid[(yi%G)*G+((xi+1)%G)],c2=grid[((yi+1)%G)*G+(xi%G)],e=grid[((yi+1)%G)*G+((xi+1)%G)];
    return a+(b-a)*fx+(c2-a)*fy+(a-b-c2+e)*fx*fy;};
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    let v=vn(x/N*G, y/N*G)*0.6+vn((x*2%N)/N*G,(y*2%N)/N*G)*0.3+r()*0.25;
    if(streak) v=vn((x*0.5)/N*G*0.5,(y*4%N)/N*G)*0.7+r()*0.3;
    const f=1+(v-0.55)*amp*2, i=(y*N+x)*4;
    d[i]=Math.min(255,d[i]*f);d[i+1]=Math.min(255,d[i+1]*f);d[i+2]=Math.min(255,d[i+2]*f);
  }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(scale,scale);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t;
}
const M = {
  coat: new THREE.MeshStandardMaterial({map:noiseTex('#8a5330',0.22,3,1), roughness:0.72, metalness:0}),
  black:new THREE.MeshStandardMaterial({map:noiseTex('#2a211b',0.3,3,2,true), roughness:0.85}),
  hoof: new THREE.MeshStandardMaterial({map:noiseTex('#4a423a',0.3,2,3), roughness:0.55}),
  white:new THREE.MeshStandardMaterial({map:noiseTex('#e9e2d2',0.1,2,4), roughness:0.8}),
  eye:  new THREE.MeshStandardMaterial({color:0x120c08, roughness:0.15, metalness:0.1}),
  nose: new THREE.MeshStandardMaterial({color:0x2b1f1a, roughness:0.9}),
};
const groundTex = noiseTex('#6a7442',0.35,40,9);
const ground = new THREE.Mesh(new THREE.CircleGeometry(40,64),
  new THREE.MeshStandardMaterial({map:groundTex, roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

/* ---------- geometry helpers ---------- */
const sph=(r,mat,sx=1,sy=1,sz=1,ws=18,hs=12)=>{
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,ws,hs),mat); m.scale.set(sx,sy,sz); m.castShadow=m.receiveShadow=true; return m;};
// tapered limb hanging down from origin (top at y=0)
const limb=(rt,rb,len,mat,zs=1,seg=12)=>{
  const g=new THREE.CylinderGeometry(rt,rb,len,seg,1); g.translate(0,-len/2,0);
  const m=new THREE.Mesh(g,mat); m.scale.z=zs; m.castShadow=m.receiveShadow=true; return m;};
// tapered shape along +x
const alongX=(r0,r1,len,mat,zs=1,seg=14)=>{
  const g=new THREE.CylinderGeometry(r1,r0,len,seg,1); g.translate(0,len/2,0); g.rotateZ(-Math.PI/2);
  const m=new THREE.Mesh(g,mat); m.scale.z=zs; m.castShadow=m.receiveShadow=true; return m;};
const G=(name,parent,x=0,y=0,z=0)=>{const g=new THREE.Group(); g.name=name; g.position.set(x,y,z); if(parent)parent.add(g); return g;};
const place=(m,parent,x=0,y=0,z=0)=>{m.position.set(x,y,z); parent.add(m); return m;};

/* ---------- horse build (faces +X, Y up, 1 unit = 1 m) ---------- */
const root=G('horse'); scene.add(root);
const body=G('body',root,0,1.2,0);
const torso=G('torso',body);
place(sph(0.42,M.coat,1.5,0.98,0.82,28,18),torso,0.0,0.0,0);          // barrel
place(sph(0.42,M.coat,1.05,1.1,0.8,24,16),torso,0.5,0.02,0);            // chest
place(sph(0.4,M.coat,1.1,1.0,0.9,24,16),torso,-0.52,0.05,0);           // rump / croup
place(sph(0.25,M.coat,1.6,0.8,0.8,16,10),torso,0.0,-0.12,0);            // belly
place(sph(0.17,M.coat,1.4,0.7,0.6,16,10),torso,0.42,0.34,0);             // withers

// legs
const legs={};
function makeLeg(id,x,z,hind){
  const up=G(id+'_upper',body,x,hind?-0.05:-0.1,z);
  const side=Math.sign(z);
  if(!hind){
    place(sph(0.19,M.coat,1.1,1.45,0.95,16,12),up,0.0,-0.1,0);            // shoulder/forearm muscle
    place(limb(0.15,0.095,0.46,M.coat,0.95),up);
  } else {
    place(sph(0.23,M.coat,1.0,1.5,0.9,16,12),up,0.03,-0.12,0);          // thigh
    place(limb(0.17,0.095,0.5,M.coat,0.9),up);
  }
  const L=hind?0.5:0.46;
  const low=G(id+'_lower',up,0,-L,0);
  place(sph(0.1,M.black,1,1,0.95,12,8),low);                          // knee / hock
  const cl=hind?0.36:0.34;
  place(limb(0.075,0.06,cl,M.black,1,10),low);
  const fet=G(id+'_hoof',low,0,-cl,0);                                  // fetlock pivot
  place(sph(0.08,M.black,1,1,1,10,8),fet);
  const feather=new THREE.Mesh(new THREE.ConeGeometry(0.085,0.2,8),M.white);
  feather.geometry.rotateX(Math.PI); feather.geometry.translate(0,-0.07,0); feather.scale.z=0.9; feather.castShadow=true;
  place(feather,fet,-0.035,0,0).rotation.z=0.25;
  const past=G(id+'_pastern',fet); past.rotation.z=0.4;
  place(limb(0.062,0.066,0.1,M.black,1,10),past);
  const h=G('hoofMesh',past,0,-0.1,0);
  const hg=new THREE.CylinderGeometry(0.07,0.1,0.08,14); hg.translate(0,-0.035,0);
  const hm=new THREE.Mesh(hg,M.hoof); hm.castShadow=true; hm.scale.z=0.92; h.add(hm);
  legs[id]={upper:up,lower:low,hoof:fet,hoofMesh:hm};
  return up;
}
makeLeg('fl',0.5,0.17,false); makeLeg('fr',0.5,-0.17,false);
makeLeg('hl',-0.55,0.17,true); makeLeg('hr',-0.55,-0.17,true);

// neck
const neck=G('neck',body,0.64,0.16,0);
const nk=new THREE.CylinderGeometry(0.17,0.3,0.78,16,1); nk.translate(0,0.39,0);
const nkm=new THREE.Mesh(nk,M.coat); nkm.scale.z=0.72; nkm.castShadow=nkm.receiveShadow=true; neck.add(nkm);
place(sph(0.3,M.coat,1,1,0.72,16,10),neck,0,0,0);
place(sph(0.19,M.coat,0.8,1.9,0.5,14,10),neck,-0.09,0.42,0).rotation.z=0.12; // crest arch
place(sph(0.18,M.coat,1,1,0.72,14,10),neck,0,0.78,0);
// mane: tufts along crest (local -x side)
const mane=G('mane',neck); const tufts=[];
const NT=18;
for(let i=0;i<NT;i++){
  const t=i/(NT-1), y=0.0+t*0.76, r=0.27-t*0.1;
  const g=G('maneTuft'+i,mane,-(r+0.02),y+0.05,((i%3)-1)*0.03);
  const L=0.34+0.06*Math.sin(i*2.1)-0.08*t;
  const cg=new THREE.SphereGeometry(0.075,10,8); cg.scale(0.75,L/0.075*0.5,1.5); cg.translate(0,-L*0.5+0.03,0);
  const c=new THREE.Mesh(cg,M.black); c.castShadow=true; g.add(c);
  g.userData.ph=i*0.6; tufts.push(g);
}
// head
const head=G('head',neck,0,0.8,0); head.rotation.z=0.0;
place(sph(0.16,M.coat,1.15,1.05,0.9,18,12),head,0.06,0,0);               // skull
place(sph(0.16,M.coat,1.35,1.05,0.88,18,12),head,0.2,-0.08,0);           // cheek
place(alongX(0.13,0.08,0.5,M.coat,0.85,14),head,0.2,-0.035,0);          // nasal bridge
place(sph(0.092,M.coat,1.1,0.95,0.95,14,10),head,0.7,-0.055,0);          // muzzle
const blaze=place(alongX(0.03,0.025,0.5,M.white,0.4,8),head,0.17,0.035,0); blaze.rotation.z=-0.05; blaze.position.z=0; blaze.scale.set(1,1.0,0.5);
blaze.geometry.scale(1,1.0,1);
place(sph(0.06,M.white,1.0,1.0,0.7,10,8),head,0.66,0.0,0); // white snip
for(const s of [1,-1]){
  place(sph(0.018,M.nose,1.4,0.9,0.7,8,6),head,0.775,-0.04,s*0.045).rotation.z=0.4;    // nostrils
  const eye=place(sph(0.03,M.eye,1,1,0.8,12,8),head,0.2,0.055,s*0.112); eye.castShadow=false;
  place(sph(0.043,M.coat,1,0.7,0.5,10,6),head,0.2,0.085,s*0.1);                         // brow
}
// jaw
const jaw=G('jaw',head,0.2,-0.11,0);
place(alongX(0.085,0.062,0.46,M.coat,0.8,12),jaw,0.0,-0.01,0);
place(sph(0.065,M.coat,1.1,0.95,0.8,10,8),jaw,0.5,-0.01,0);
place(sph(0.09,M.coat,1.0,0.95,0.85,12,8),jaw,0.04,0.0,0);
// ears
const ears={};
for(const [id,s] of [['L',1],['R',-1]]){
  const e=G('ear'+id,head,0.0,0.12,s*0.075);
  const eg=new THREE.ConeGeometry(0.04,0.15,8); eg.translate(0,0.075,0);
  const em=new THREE.Mesh(eg,M.coat); em.scale.z=0.5; em.castShadow=true; e.add(em);
  ears[id]=e; e.userData.s=s;
}
// forelock
const fore=G('forelock',head,0.05,0.14,0);
{const fg=new THREE.ConeGeometry(0.05,0.22,6); fg.rotateX(Math.PI); fg.translate(0,-0.11,0);
 const f=new THREE.Mesh(fg,M.black); f.scale.z=1.5; f.rotation.z=-0.3; f.castShadow=true; fore.add(f);}

// tail (3-segment chain)
const tail=G('tail',body,-0.9,0.3,0);
const tailSegs=[]; let par=tail; const tl=[0.3,0.38,0.4];
for(let i=0;i<3;i++){
  const sg=G('tail'+(i+1),par,0,i?-tl[i-1]:0,0);
  const rt=[0.08,0.12,0.12][i], rb=[0.12,0.12,0.04][i];
  const m=limb(rt,rb,tl[i]+0.02,M.black,0.85,10); sg.add(m);
  tailSegs.push(sg); par=sg;
}
tailSegs[0].userData.base=-0.45; tailSegs[1].userData.base=0.15; tailSegs[2].userData.base=0.1;

const parts={root,body,torso,neck,mane,head,jaw,earL:ears.L,earR:ears.R,forelock:fore,tail,tail1:tailSegs[0],tail2:tailSegs[1],tail3:tailSegs[2],
  legFL:legs.fl.upper,legFR:legs.fr.upper,legHL:legs.hl.upper,legHR:legs.hr.upper,
  fl:legs.fl,fr:legs.fr,hl:legs.hl,hr:legs.hr};

/* ---------- animation system ---------- */
const TAU=Math.PI*2, clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const wrap=x=>x-Math.floor(x);
const pulse=(p,c,w)=>{let d=wrap(p-c+0.5)-0.5;return Math.exp(-(d*d)/(w*w));};   // periodic gaussian bump

function basePose(){
  const p={bodyY:0,pitch:0,roll:0,breath:0,neckZ:-0.85,neckY:0,headZ:0.02,headY:0,headX:0,jaw:0,
    earLz:-0.12,earRz:-0.12,earLx:0.3,earRx:-0.3,tailZ:0,tailY:0,tailLift:0,speed:0,mane:0};
  for(const id of ['fl','fr']) Object.assign(p,{[id+'U']:0,[id+'L']:0,[id+'F']:0});
  for(const id of ['hl','hr']) Object.assign(p,{[id+'U']:-0.3,[id+'L']:0.35,[id+'F']:-0.05});
  return p;
}
const clips={
  idle:{label:'Покой',duration:6,pose(p){
    const o=basePose(), s=TAU*p;
    o.breath=0.014*Math.sin(s*3); o.bodyY=0.004*Math.sin(s*3+0.5);
    o.neckZ+=0.035*Math.sin(s)+0.015*Math.sin(s*3); o.neckY=0.1*Math.sin(s*2+1);
    o.headZ+=0.06*Math.sin(s*2+0.4)+0.02*Math.sin(s*3); o.headY=0.12*Math.sin(s*1)+0.05*pulse(p,0.62,0.04);
    o.jaw=0.02+0.015*Math.sin(s*3);
    const tw=pulse(p,0.3,0.025)*Math.sin(s*14), tw2=pulse(p,0.78,0.02)*Math.sin(s*16);
    o.earLz+=0.12*tw+0.15*Math.sin(s*2); o.earRz+=0.12*tw2-0.1*Math.sin(s*2+1); o.earLx+=0.1*tw; o.earRx-=0.1*tw2;
    o.tailZ=0.05*Math.sin(s*2); o.tailY=0.25*Math.sin(s*3+0.3)+0.2*pulse(p,0.55,0.06)*Math.sin(s*10);
    // hind leg rests (weight shift)
    const rest=sstep(Math.sin(s)*1.6+0.2)*0.5;
    o.hrU+=0.12*rest; o.hrL-=0.05*rest; o.hrF+=0.3*rest; o.bodyY-=0.003*rest; o.roll=0.01*rest;
    return o;}},
  walk:{label:'Шаг',duration:2,pose(p){
    const o=basePose(), s=TAU*p; o.speed=1;
    const offs={hl:0,fl:0.25,hr:0.5,fr:0.75};
    for(const id in offs){
      const a=TAU*(p+offs[id]), sn=Math.sin(a), cs=Math.cos(a), lift=Math.pow(Math.max(0,cs),0.8);
      if(id[0]==='f'){
        o[id+'U']=0.36*sn; o[id+'L']=-1.25*lift; o[id+'F']=-0.45*lift+0.12*sn;
      } else {
        o[id+'U']=-0.3+0.3*sn; o[id+'L']=0.35-0.75*lift; o[id+'F']=-0.05-0.3*lift+0.1*sn;
      }
    }
    o.bodyY=0.018*Math.cos(2*s)-0.01; o.roll=0.025*Math.sin(s*1+1.2); o.pitch=0.015*Math.sin(2*s+0.8);
    o.neckZ+=0.07*Math.sin(2*s+0.3); o.headZ+=0.07*Math.sin(2*s+1.2)+0.03*Math.sin(s); o.neckY=0.05*Math.sin(s);
    o.breath=0.01*Math.sin(s*3);
    o.jaw=0.01;
    o.earLz+=0.08*Math.sin(2*s); o.earRz+=0.08*Math.sin(2*s+0.5);
    o.tailZ=0.12*Math.sin(2*s+1); o.tailY=0.3*Math.sin(s+0.4);
    return o;}},
  graze:{label:'Пасётся',duration:8,pose(p){
    const o=basePose(), s=TAU*p;
    const g=sstep(clamp((0.5-0.5*Math.cos(s))*2.4,0,1));
    o.neckZ+=-1.3*g+0.04*Math.sin(s*8)*g; o.headZ+=0.75*g; o.neckY=0.12*Math.sin(s*4)*g+0.1*Math.sin(s)*(1-g);
    o.jaw=0.01+g*(0.13*(0.5+0.5*Math.sin(s*12))); o.headY=0.08*Math.sin(s*6)*g;
    o.pitch=-0.03*g; o.bodyY=-0.02*g+0.004*Math.sin(s*5);
    o.breath=0.012*Math.sin(s*5);
    // front legs spread a bit
    o.flU=0.14*g; o.frU=-0.1*g; o.flL=-0.1*g; o.frL=0; 
    o.earLz+=-0.1*g+0.18*pulse(p,0.7,0.03)*Math.sin(s*20); o.earRz+=-0.1*g+0.1*Math.sin(s*4);
    o.tailZ=0.06*Math.sin(s*2); o.tailY=0.45*Math.sin(s*6)*(0.5+0.5*Math.sin(s*2));
    o.mane=1;
    return o;}},
  neigh:{label:'Ржание',duration:4,pose(p){
    const o=basePose(), s=TAU*p;
    const g=sstep(clamp((0.5-0.5*Math.cos(s))*2.2,0,1));
    const call=g*(0.5+0.5*Math.sin(s*5-1.2));
    o.neckZ+=0.38*g; o.headZ+=0.55*g+0.05*Math.sin(s*5)*g; o.pitch=0.07*g; o.bodyY=0.03*g;
    o.jaw=0.02+0.3*call; o.breath=0.03*g*Math.sin(s*5)+0.012*Math.sin(s*3);
    o.neckY=0.08*Math.sin(s*5)*g;
    o.earLz+=0.3*g; o.earRz+=0.3*g; o.earLx+=0.1*g; o.earRx-=0.1*g;
    o.tailZ=-0.35*g; o.tailY=0.1*Math.sin(s*5)*g; o.tailLift=g;
    o.flU=0.1*g; o.frU=0.1*g; o.hlU+=0.05*g; o.hrU+=0.05*g;
    return o;}},
};

const state={clip:'idle',t:0,playing:true,speed:1,blend:1,from:null,last:basePose(),scroll:0};
class Spring{constructor(){this.x=0;this.v=0;} step(tg,dt,k,c){const a=k*(tg-this.x)-c*this.v;this.v+=a*dt;this.x+=this.v*dt;}}
const sp={t1:new Spring(),t2:new Spring(),t3:new Spring(),y1:new Spring(),y2:new Spring(),y3:new Spring(),
  eLz:new Spring(),eRz:new Spring(),neck:new Spring(),lift:new Spring()};

function mixPose(a,b,w){const o={};for(const k in b)o[k]=a[k]+(b[k]-a[k])*w;return o;}
function currentPose(){
  const c=clips[state.clip], target=c.pose(wrap(state.t/c.duration));
  return state.blend<1 ? mixPose(state.from,target,sstep(state.blend)) : target;
}
function applyPose(p){
  body.position.y=baseY+p.bodyY; body.rotation.z=p.pitch; body.rotation.x=p.roll;
  torso.scale.set(1,1+p.breath,1+p.breath*0.8);
  neck.rotation.z=p.neckZ; neck.rotation.y=p.neckY; head.rotation.z=p.headZ; head.rotation.y=p.headY*0.6; head.rotation.x=p.headX;
  jaw.rotation.z=-p.jaw;
  ears.L.rotation.set(p.earLx,0,sp.eLz.x); ears.R.rotation.set(p.earRx,0,sp.eRz.x);
  for(const id of ['fl','fr','hl','hr']){
    const l=legs[id]; l.upper.rotation.z=p[id+'U']; l.lower.rotation.z=p[id+'L']; l.hoof.rotation.z=p[id+'F'];
  }
  tail.rotation.z=-0.1-1.0*sp.lift.x; tail.rotation.y=sp.y1.x*0.4;
  const tz=[sp.t1.x,sp.t2.x,sp.t3.x], ty=[sp.y1.x,sp.y2.x,sp.y3.x];
  tailSegs.forEach((sg,i)=>{sg.rotation.z=sg.userData.base*(1-0.7*sp.lift.x)+tz[i]; sg.rotation.y=ty[i]*(i?0.5:0.3);});
  // mane trails neck motion
  const lag=(p.neckZ-sp.neck.x);
  tufts.forEach((g,i)=>{g.rotation.z=-p.neckZ*0.9-0.3+lag*1.2+0.03*Math.sin(state.t*2.3+g.userData.ph)*(1+p.mane); g.rotation.x=0.02*Math.sin(state.t*1.7+g.userData.ph);});
  fore.rotation.z=lag*1.2+0.03*Math.sin(state.t*3);
}
function stepSprings(p,dt){
  const sub=Math.max(1,Math.ceil(dt/(1/120))), h=dt/sub;
  for(let i=0;i<sub;i++){
    sp.t1.step(p.tailZ,h,60,5); sp.t2.step(sp.t1.x*0.9+0.0,h,45,4); sp.t3.step(sp.t2.x*0.9,h,35,3.5);
    sp.y1.step(p.tailY,h,50,4.5); sp.y2.step(sp.y1.x,h,40,3.5); sp.y3.step(sp.y2.x,h,30,3);
    sp.eLz.step(p.earLz,h,220,14); sp.eRz.step(p.earRz,h,220,14);
    sp.neck.step(p.neckZ,h,40,6); sp.lift.step(p.tailLift,h,25,7);
  }
}
let baseY=1.2;
function update(dt){
  dt=clamp(dt,0,0.05)*state.speed;
  if(state.playing||dt===0&&false){ }
  if(state.playing){ state.t+=dt; if(state.blend<1) state.blend=Math.min(1,state.blend+dt/0.45); }
  const p=currentPose(); if(state.playing&&dt>0) stepSprings(p,dt);
  applyPose(p); state.last=p;
  if(state.playing){ state.scroll+=p.speed*dt*0.7/2; groundTex.offset.x=state.scroll*(40*0+1)*0.0+ (state.scroll*1.0)/ (40/ (groundTex.repeat.x? (40*2/ groundTex.repeat.x):1)) ; }
  // ground scroll: world units -> texture units (circle diameter 80 spans repeat.x tiles)
  groundTex.offset.x = state.scroll*(groundTex.repeat.x/80)*2;
}
function setClip(name,t=0,instant=false){
  if(!clips[name])return;
  state.from=state.last; state.clip=name; state.t=t; state.blend=instant?1:0;
  document.querySelectorAll('#clips button').forEach(b=>b.classList.toggle('on',b.dataset.c===name));
}
/* auto-ground: put hooves on y=0 */
{
  applyPose(clips.idle.pose(0.0)); root.updateMatrixWorld(true);
  let minY=1e9; for(const id in legs){const b=new THREE.Box3().setFromObject(legs[id].hoofMesh); minY=Math.min(minY,b.min.y);}
  baseY=1.2-minY; applyPose(clips.idle.pose(0.0));
}

/* ---------- UI ---------- */
const cl=document.getElementById('clips');
for(const k in clips){const b=document.createElement('button');b.textContent=clips[k].label;b.dataset.c=k;b.onclick=()=>setClip(k);cl.appendChild(b);}
document.querySelector('#clips button').classList.add('on');
const sIn=document.getElementById('speed'), sV=document.getElementById('sv');
sIn.oninput=()=>{state.speed=+sIn.value;sV.textContent=state.speed.toFixed(1)+'×';};
const pb=document.getElementById('play');
pb.onclick=()=>{state.playing=!state.playing;pb.textContent=state.playing?'Пауза':'Играть';};
document.getElementById('reset').onclick=()=>{
  state.t=0;state.scroll=0;state.playing=true;pb.textContent='Пауза';sIn.value=1;state.speed=1;sV.textContent='1.0×';
  camera.position.copy(CAM0);controls.target.copy(TGT0);controls.update();setClip('idle',0,true);
  for(const k in sp){sp[k].x=0;sp[k].v=0;}
};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

window.animal={root,parts,clips,state,setClip,
  // deterministic seek for tests: warm springs by simulating 1.5 s up to time t
  seek(name,t){ setClip(name,Math.max(0,t-1.5),true); for(let i=0;i<90;i++){state.t+=1/60;const p=currentPose();stepSprings(p,1/60);} applyPose(currentPose()); }};
window.__three={camera,controls,renderer,scene};

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{ update(clock.getDelta()); controls.update(); renderer.render(scene,camera); });
window.__tris=()=>renderer.info.render.triangles;
</script>
</body>
