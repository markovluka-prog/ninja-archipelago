<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Средневековая свинья — процедурная 3D-модель</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#1c1a17;overflow:hidden;font-family:system-ui,sans-serif;color:#eee}
  #c{display:block;width:100%;height:100%}
  #ui{position:fixed;left:12px;top:10px;right:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  h1{margin:0;font-size:20px;font-weight:600;text-shadow:0 1px 4px #000}
  #bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:auto}
  button{background:#3a342c;color:#f1e8d8;border:1px solid #6b5d49;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
  button.on{background:#a8744a;border-color:#e0b588}
  label{font-size:13px;display:flex;gap:6px;align-items:center;background:#2a251f;padding:4px 10px;border-radius:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Свинья средневековая (полудикого типа)</h1>
  <div id="bar">
    <span id="clips" style="display:contents"></span>
    <button id="pp">Пауза</button>
    <button id="rs">Сброс</button>
    <label>Скорость <input id="sp" type="range" min="0.1" max="2.5" step="0.05" value="1"><span id="spv">1.0×</span></label>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3b3a33);
scene.fog = new THREE.Fog(0x3b3a33, 7, 16);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 50);
camera.position.set(2.4, 1.3, 2.6);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 1; controls.maxDistance = 8;

// lights: key, fill, rim
const key = new THREE.DirectionalLight(0xfff0d8, 2.4);
key.position.set(3, 4.5, 2.5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, {left:-2.5, right:2.5, top:2.5, bottom:-2.5, near:1, far:12});
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 4;
scene.add(key);
const fill = new THREE.DirectionalLight(0xaec4ff, 0.7); fill.position.set(-3, 2, 1.5); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffd9b0, 1.2); rim.position.set(-1, 2.5, -4); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x4a3d2a, 0.3));

// ---------- textures ----------
function noiseTex(base, amp, scale, repeat = 1, seed = 1) {
  const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, s, s);
  let r = seed * 9301 + 49297; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const img = g.getImageData(0, 0, s, s), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() - 0.5) * amp;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
  g.globalAlpha = 0.08;
  for (let i = 0; i < 160; i++) {          // soft blotches
    g.fillStyle = rnd() > 0.5 ? '#000' : '#fff';
    g.beginPath(); g.arc(rnd() * s, rnd() * s, 4 + rnd() * scale, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function bumpOf(seed, rep) { const t = noiseTex('#808080', 90, 20, rep, seed); t.colorSpace = THREE.NoColorSpace; return t; }

const M = {
  skin: new THREE.MeshStandardMaterial({color: 0xffffff, vertexColors: true, map: noiseTex('#c9a08a', 30, 24, 3, 2), bumpMap: bumpOf(3, 3), bumpScale: 0.4, roughness: 0.78}),
  skin2: new THREE.MeshStandardMaterial({color: 0xb8947e, map: noiseTex('#d4ab94', 26, 18, 2, 4), bumpMap: bumpOf(5, 2), bumpScale: 0.6, roughness: 0.75}),
  coat: new THREE.MeshStandardMaterial({color: 0x6a4c3a, map: noiseTex('#8a6a54', 50, 12, 2, 11), bumpMap: bumpOf(12, 3), bumpScale: 0.8, roughness: 0.92}),
  bristle: new THREE.MeshStandardMaterial({color: 0x4a3626, map: noiseTex('#6a5040', 50, 10, 1, 6), roughness: 0.95}),
  dark: new THREE.MeshStandardMaterial({color: 0x5a4034, map: noiseTex('#7a5a48', 40, 14, 2, 7), roughness: 0.85}),
  nose: new THREE.MeshStandardMaterial({color: 0xd69a96, roughness: 0.45, bumpMap: bumpOf(8, 2), bumpScale: 0.5}),
  hoof: new THREE.MeshStandardMaterial({color: 0x2c2420, roughness: 0.55}),
  ivory: new THREE.MeshStandardMaterial({color: 0xe8dcc0, roughness: 0.4}),
  eye: new THREE.MeshStandardMaterial({color: 0x110c08, roughness: 0.15, metalness: 0.2}),
  ground: new THREE.MeshStandardMaterial({color: 0x6e6446, map: noiseTex('#7d7352', 40, 30, 14, 9), roughness: 1})
};

const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 64), M.ground);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// ---------- helpers ----------
const G = (name, parent, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); parent && parent.add(g); return g; };
function mesh(geo, mat, parent, x = 0, y = 0, z = 0, name = '') {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; if (name) m.name = name; parent && parent.add(m); return m;
}
function ell(rx, ry, rz, mat, parent, x, y, z, name, seg = 20) {
  const m = mesh(new THREE.SphereGeometry(1, seg, Math.round(seg * 0.75)), mat, parent, x, y, z, name);
  m.scale.set(rx, ry, rz); return m;
}
// tapered limb segment hanging down from pivot (y 0 to -len)
function limb(len, rTop, rBot, mat, parent, name) {
  const geo = new THREE.CylinderGeometry(rTop, rBot, len, 14, 1);
  geo.translate(0, -len / 2, 0);
  return mesh(geo, mat, parent, 0, 0, 0, name);
}

// ---------- model ----------
const root = G('root', scene);
const parts = {root};
const body = G('body', root); parts.body = body;

// torso: deformed sphere, deep chest, tucked belly, higher shoulders (razorback)
{
  const geo = new THREE.SphereGeometry(1, 40, 30);
  const p = geo.attributes.position, cols = [];
  const c1 = new THREE.Color(0x4a3426), c2 = new THREE.Color(0xb48e76), cc = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const u = z;                                  // -1 rump .. +1 chest
    const wx = 0.2 * (1 + 0.12 * u - 0.04 * u * u);
    let wy = 0.27 * (1 + 0.06 * u);
    if (y < 0) wy *= (u < -0.2 ? 0.8 : u > 0.2 ? 1.0 : 0.82);   // tucked flank
    const cy = 0.80 + 0.03 * u - 0.03 * u * u;     // arched back
    p.setXYZ(i, x * wx, cy + y * wy, z * 0.66);
    cc.copy(c2).lerp(c1, THREE.MathUtils.smoothstep(y, -0.5, 0.9));
    cols.push(cc.r, cc.g, cc.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  mesh(geo, M.skin, body, 0, 0, 0, 'torso');
  parts.torsoGeo = geo;
}
// rump / ham bulges


// bristle ridge along spine (placed on torso top surface)
const bristles = G('bristles', body); parts.bristles = bristles; parts.bristleList = [];
{
  const p = parts.torsoGeo.attributes.position;
  const topAt = (z) => { let best = -1, by = 0; for (let i = 0; i < p.count; i++) { if (Math.abs(p.getX(i)) < 0.03) { const d = Math.abs(p.getZ(i) - z); if (d < 0.03 && p.getY(i) > by) { by = p.getY(i); best = i; } } } return by; };
  const N = 30;
  for (let i = 0; i < N; i++) {
    const z = 0.58 - i * (1.1 / (N - 1));
    const y = topAt(z); if (!y) continue;
    const h = 0.07 + 0.05 * Math.sin(Math.PI * Math.min(1, (i + 2) / (N * 0.7))) + (i < 12 ? 0.02 : 0);
    const cone = new THREE.ConeGeometry(0.022, h, 6); cone.translate(0, h / 2, 0);
    const piv = G('bristle' + i, bristles, 0, y - 0.01, z); piv.rotation.x = -0.35;   // lean backward
    mesh(cone, M.bristle, piv);
    parts.bristleList.push(piv);
  }
}

// neck + head
const neck = G('neck', body, 0, 0.93, 0.5); parts.neck = neck;
{
  ell(0.12, 0.135, 0.27, M.coat, neck, 0, 0, 0.1, 'neckMesh', 24);
  // mane tuft on neck
  const mane = G('mane', neck); parts.mane = mane;
  for (let i = 0; i < 5; i++) {
    const h = 0.08; const cone = new THREE.ConeGeometry(0.02, h, 6); cone.translate(0, h / 2, 0);
    const piv = G('maneB' + i, mane, 0, 0.1 - i * 0.004, 0.2 - i * 0.07); piv.rotation.x = -0.3;
    mesh(cone, M.bristle, piv); parts.bristleList.push(piv);
  }
}
const head = G('head', neck, 0, 0, 0.36); parts.head = head;
{
  ell(0.115, 0.125, 0.19, M.skin2, head, 0, 0, 0.08, 'skull');
  // long tapered snout
  const sg = new THREE.CylinderGeometry(0.052, 0.078, 0.3, 16); sg.rotateX(Math.PI / 2);   // wide end at -z after rotate? ensure narrow at +z
  const snout = mesh(sg, M.skin2, head, 0, -0.035, 0.3, 'snout');
  snout.rotation.x = 0.12;
  // nose disc
  const nose = G('nose', head, 0, -0.06, 0.465); parts.nose = nose; nose.rotation.x = 0.12;
  const disc = ell(0.062, 0.058, 0.032, M.nose, nose, 0, 0, -0.005, 'disc', 18);
  for (const s of [-1, 1]) ell(0.012, 0.016, 0.01, M.eye, nose, s * 0.02, 0.004, 0.02, 'nostril');
  // eyes
  for (const s of [-1, 1]) {
    const e = ell(0.02, 0.02, 0.02, M.eye, head, s * 0.104, 0.04, 0.12, s < 0 ? 'eyeL' : 'eyeR', 12);
    parts[s < 0 ? 'eyeL' : 'eyeR'] = e;
  }
  // jaw
  const jaw = G('jaw', head, 0, -0.085, 0.12); parts.jaw = jaw;
  const jg = new THREE.CylinderGeometry(0.03, 0.05, 0.2, 12); jg.rotateX(Math.PI / 2);
  const jm = mesh(jg, M.skin2, jaw, 0, 0.005, 0.1, 'jawMesh'); jm.rotation.x = 0.0;
  for (const s of [-1, 1]) {   // small tusks
    const tg = new THREE.ConeGeometry(0.012, 0.075, 8); tg.translate(0, 0.0375, 0);
    const t = mesh(tg, M.ivory, jaw, s * 0.035, 0.01, 0.17, 'tusk'); t.rotation.set(-0.3, 0, -s * 0.35);
  }
  // ears: thin leaf-like, upright-ish and flopping forward
  for (const s of [-1, 1]) {
    const ear = G(s < 0 ? 'earL' : 'earR', head, s * 0.085, 0.11, 0.0);
    parts[s < 0 ? 'earL' : 'earR'] = ear;
    const eg = new THREE.ConeGeometry(0.06, 0.14, 14); eg.scale(1, 1, 0.22); eg.translate(0, 0.08, 0);
    const em = mesh(eg, M.skin2, ear, 0, 0, 0, 'earMesh');
    const ig = new THREE.ConeGeometry(0.045, 0.12, 12); ig.scale(1, 1, 0.1); ig.translate(0, 0.065, 0.012);
    mesh(ig, M.nose, ear);
    ear.userData.base = new THREE.Euler(0.35, s * 0.1, -s * 1.05);
    ear.rotation.copy(ear.userData.base);
  }
}

// legs
function makeLeg(name, x, y, z, front) {
  const sg = front ? 1 : 1.1;
  const up = G(name + 'Upper', body, x, y, z);
  ell(front ? 0.09 : 0.105, front ? 0.1 : 0.12, front ? 0.11 : 0.14, M.coat, up, 0, 0.02, 0, 'joint', 14);
  limb(0.31, front ? 0.08 : 0.095, 0.052, M.coat, up, 'thigh');
  const lo = G(name + 'Lower', up, 0, -0.31, 0);
  ell(0.056, 0.056, 0.056, M.coat, lo, 0, 0, 0, 'knee', 10);
  limb(0.28, 0.046, 0.037, M.dark, lo, 'shin');
  const hf = G(name + 'Hoof', lo, 0, -0.28, 0);
  const hg = new THREE.CylinderGeometry(0.04, 0.046, 0.065, 10); hg.translate(0, -0.03, 0.006);
  mesh(hg, M.hoof, hf, 0, 0, 0, 'hoofMesh');
  for (const s of [-1, 1]) { const d = ell(0.014, 0.016, 0.02, M.hoof, hf, s * 0.03, -0.055, -0.022, 'dew', 8); }
  return {up, lo, hf};
}
const legs = {
  FL: makeLeg('legFL', 0.105, 0.68, 0.4, true),
  FR: makeLeg('legFR', -0.105, 0.68, 0.4, true),
  HL: makeLeg('legHL', 0.11, 0.7, -0.47, false),
  HR: makeLeg('legHR', -0.11, 0.7, -0.47, false)
};
parts.legs = legs;
for (const k in legs) { parts['leg' + k + 'Upper'] = legs[k].up; parts['leg' + k + 'Lower'] = legs[k].lo; parts['leg' + k + 'Hoof'] = legs[k].hf; }

// tail: chain of segments with a loose curl
const tail = G('tail', body, 0, 0.87, -0.62); parts.tail = tail;
const tailSegs = [tail];
ell(0.03, 0.03, 0.03, M.coat, tail, 0, 0, 0, 'tailBase', 10);
{
  let par = tail; const lens = [0.1, 0.09, 0.08, 0.07];
  lens.forEach((L, i) => {
    const g = new THREE.CylinderGeometry(0.014 - i * 0.002, 0.018 - i * 0.002, L, 8); g.translate(0, -L / 2, 0);
    mesh(g, M.skin2, par, 0, 0, 0, 'tailSeg' + i);
    const nx = G('tail' + (i + 1), par, 0, -L, 0); tailSegs.push(nx); par = nx;
  });
  const tuft = ell(0.016, 0.03, 0.016, M.bristle, par, 0, -0.02, 0, 'tailTuft', 8);
  parts.tailSegs = tailSegs;
}

// ---------- animation ----------
const TAU = Math.PI * 2, sin = Math.sin, cos = Math.cos;
const bump = (t, c, w) => { const d = Math.abs(((t - c + 0.5) % 1 + 1) % 1 - 0.5); return d < w ? 0.5 + 0.5 * cos(Math.PI * d / w) : 0; };
const sm = x => x * x * (3 - 2 * x);

const neutral = () => {
  body.position.set(0, 0, 0); body.rotation.set(0, 0, 0); body.scale.set(1, 1, 1);
  neck.rotation.set(0.12, 0, 0); head.rotation.set(0.42, 0, 0); parts.jaw.rotation.set(0, 0, 0);
  for (const k in legs) { legs[k].up.rotation.set(0, 0, 0); legs[k].lo.rotation.set(0, 0, 0); legs[k].hf.rotation.set(0, 0, 0); }
  legs.HL.up.rotation.x = legs.HR.up.rotation.x = -0.18; legs.HL.lo.rotation.x = legs.HR.lo.rotation.x = 0.34;
  legs.HL.hf.rotation.x = legs.HR.hf.rotation.x = -0.16;
};
function earPose(t, amp, flick) {
  for (const s of [-1, 1]) {
    const e = parts[s < 0 ? 'earL' : 'earR'], b = e.userData.base;
    const lag = s < 0 ? 0 : 0.07;
    e.rotation.set(b.x + 0.05 * sin(TAU * (t - 0.12)) + (flick ? flick(s) : 0) + amp * sin(TAU * (t * 2 - lag)), b.y, b.z + (flick ? -s * flick(s) * 0.7 : 0));
  }
}
function tailPose(t, amp, curlBase = 0.9, freq = 1, phase = 0) {
  tailSegs.forEach((sg, i) => {
    const lag = -i * 0.07;
    sg.rotation.z = (i === 0 ? 0.4 : 0.45) * curlBase * (i ? 1 : 0.6) * (i === 0 ? 1 : 1) + amp * sin(TAU * (t * freq + lag + phase));
    sg.rotation.x = i === 0 ? 0.55 : 0.0 + 0.1 * sin(TAU * (t * freq + lag + 0.25));
    if (i > 0) sg.rotation.x = 0.0;
  });
  tailSegs[0].rotation.z = amp * 0.7 * sin(TAU * (t * freq + phase));
  tailSegs[1].rotation.z = 0.5 * curlBase + amp * 0.9 * sin(TAU * (t * freq - 0.08 + phase));
  tailSegs[2].rotation.z = 0.7 * curlBase + amp * sin(TAU * (t * freq - 0.16 + phase));
  tailSegs[3].rotation.z = 0.7 * curlBase + amp * sin(TAU * (t * freq - 0.24 + phase));
  tailSegs[4].rotation.z = 0.6 * curlBase + amp * sin(TAU * (t * freq - 0.32 + phase));
  tailSegs[0].rotation.x = 0.75;
}
function bristlePose(t, amp) {
  parts.bristleList.forEach((b, i) => { b.rotation.x = -0.35 + amp * sin(TAU * (t - i * 0.02)); });
}

const clips = {
  'Покой': {T: 5, fn(t) {
    neutral();
    const br = sin(TAU * t * 2);                         // 2 breaths / loop
    body.scale.set(1 + 0.008 * br, 1 + 0.014 * br, 1 + 0.006 * br);
    body.position.y = 0.004 * br;
    neck.rotation.x = 0.12 + 0.03 * sin(TAU * (t * 2 - 0.1)) + 0.05 * sin(TAU * t);
    neck.rotation.y = 0.22 * sin(TAU * t) + 0.08 * sin(TAU * t * 3);
    head.rotation.x = 0.42 + 0.06 * sin(TAU * (t * 2 - 0.2)) + 0.05 * sin(TAU * t * 3);
    head.rotation.y = 0.12 * sin(TAU * (t - 0.08));
    head.rotation.z = 0.04 * sin(TAU * (t - 0.15));
    parts.jaw.rotation.x = 0.02 + 0.015 * sin(TAU * t * 4);
    parts.nose.scale.setScalar(1 + 0.04 * bump(t * 3, 0.5, 0.2));
    parts.nose.position.y = -0.06 + 0.006 * sin(TAU * t * 6) * bump(t, 0.3, 0.15);
    const fl = s => 0.3 * bump(t, s < 0 ? 0.22 : 0.62, 0.05) * sin(TAU * t * 14);
    earPose(t, 0.04, fl);
    tailPose(t, 0.14 + 0.18 * bump(t, 0.6, 0.12), 0.9, 2, 0);
    // weight shift
    body.rotation.z = 0.01 * sin(TAU * t);
    legs.FL.up.rotation.x = 0.02 * sin(TAU * t); legs.FR.up.rotation.x = -0.02 * sin(TAU * t);
    bristlePose(t, 0.04 * br + 0.05 * bump(t, 0.6, 0.1));
  }},
  'Шаг': {T: 1.3, fn(t) {
    neutral();
    const ph = {HL: 0, FL: 0.25, HR: 0.5, FR: 0.75};
    for (const k in legs) {
      const th = TAU * (t - ph[k]), L = legs[k], hind = k[0] === 'H';
      const A = hind ? 0.5 : 0.52;
      const swing = sin(th), lift = Math.max(0, -cos(th));
      L.up.rotation.x += A * swing * (hind ? 1 : 1) ;
      L.lo.rotation.x += (hind ? 0.55 : 0.95) * Math.pow(lift, 0.8) * (hind ? 1 : 1);
      L.hf.rotation.x += (hind ? -0.2 : -0.4) * lift - 0.15 * swing;
      if (!hind) L.lo.rotation.x -= 0.0;
    }
    body.position.y = 0.012 * Math.abs(sin(TAU * t * 2 + 0.3)) - 0.006;
    body.rotation.z = 0.035 * sin(TAU * t);            // roll
    body.rotation.y = 0.04 * sin(TAU * (t - 0.1));       // lateral snake of spine
    body.rotation.x = 0.012 * sin(TAU * t * 2 + 0.6);
    neck.rotation.x = 0.14 + 0.08 * sin(TAU * (t * 2 - 0.25));
    neck.rotation.y = -0.1 * sin(TAU * (t - 0.1));
    head.rotation.x = 0.44 + 0.06 * sin(TAU * (t * 2 - 0.45));
    head.rotation.y = 0.08 * sin(TAU * (t - 0.3));
    parts.nose.scale.setScalar(1 + 0.03 * sin(TAU * t * 4));
    earPose(t, 0.09, null);
    tailPose(t, 0.3, 0.9, 1, -0.1);
    bristlePose(t, 0.07 * sin(TAU * t * 2));
  }},
  'Рытьё носом': {T: 4, fn(t) {
    neutral();
    const down = sm(Math.min(1, bump(t, 0.5, 0.5) * 1.8));         // lower & raise smoothly across loop
    const push = 0.5 + 0.5 * sin(TAU * (t * 4 - 0.25));            // 4 rooting pushes
    const root = down * (0.7 + 0.3 * push);
    neck.rotation.x = 0.12 + 0.72 * down + 0.04 * (push * down);
    neck.rotation.y = 0.14 * sin(TAU * t * 2) * down;
    head.rotation.x = 0.42 + 0.34 * down + 0.1 * push * down;
    head.rotation.y = 0.12 * sin(TAU * t * 2 + 1) * down;
    parts.jaw.rotation.x = 0.05 * down + 0.08 * down * Math.max(0, sin(TAU * t * 8)) * (1 - 0.3 * push);
    parts.nose.scale.setScalar(1 + 0.06 * Math.max(0, sin(TAU * t * 8)) * down);
    body.rotation.x = 0.07 * down + 0.015 * push * down;
    body.position.y = -0.015 * down;
    // front legs brace; rear shift
    legs.FL.up.rotation.x = -0.2 * down; legs.FR.up.rotation.x = -0.2 * down;
    legs.FL.lo.rotation.x = 0.3 * down; legs.FR.lo.rotation.x = 0.3 * down;
    // little paw scrape of left foreleg
    const sc = bump(t, 0.55, 0.12) * down;
    legs.FL.up.rotation.x += -0.45 * sc + 0.4 * sc * sin(TAU * t * 8);
    legs.FL.lo.rotation.x += 0.7 * sc;
    earPose(t, 0.05 + 0.04 * down, s => 0.1 * down * push);
    tailPose(t, 0.22 + 0.1 * down, 0.9, 2, 0.1);
    bristlePose(t, 0.05 * sin(TAU * t * 4) * down);
  }}
};

// ---------- state / UI ----------
const state = {clip: 'Покой', time: 0, speed: 1, playing: true};
const clipBox = document.getElementById('clips');
const btns = {};
for (const name in clips) {
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => setClip(name); clipBox.appendChild(b); btns[name] = b;
}
function setClip(n) { state.clip = n; state.time = 0; for (const k in btns) btns[k].classList.toggle('on', k === n); }
setClip('Покой');
const pp = document.getElementById('pp');
pp.onclick = () => { state.playing = !state.playing; pp.textContent = state.playing ? 'Пауза' : 'Играть'; };
document.getElementById('rs').onclick = () => { state.time = 0; state.speed = 1; sp.value = 1; spv.textContent = '1.0×'; camera.position.set(2.4, 1.3, 2.6); controls.target.set(0, 0.55, 0); controls.update(); };
const sp = document.getElementById('sp'), spv = document.getElementById('spv');
sp.oninput = () => { state.speed = +sp.value; spv.textContent = state.speed.toFixed(1) + '×'; };

function apply() { const c = clips[state.clip]; c.fn(((state.time / c.T) % 1 + 1) % 1); }
const clipsApi = {};
for (const n in clips) clipsApi[n] = {duration: clips[n].T, apply: (u) => clips[n].fn(u)};
window.animal = {root, parts, clips: clipsApi, state, setClip, update: apply, setCam:(p)=>{camera.position.set(...p);controls.update();}};

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state.playing) state.time += dt * state.speed;
  apply(); controls.update(); renderer.render(scene, camera);
});
</script>
</body>
