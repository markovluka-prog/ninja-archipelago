<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">
<style>

<body>
<div id="ui">
  <h1>Корова</h1>
  <div class="grp" id="clips"></div>
  <div class="grp"><label>Скорость <span id="spv">1.0</span>×</label><input id="sp" type="range" min="0.1" max="2.5" step="0.1" value="1"></div>
  <div class="grp"><button id="pp">Пауза</button><button id="rs">Сброс</button></div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ---------- renderer / scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xcfd8d0);
scene.fog=new THREE.Fog(0xcfd8d0,9,22);
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=0.55;
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,60);
camera.position.set(2.7,1.5,3.3);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.62,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.495;
controls.minDistance=1.5;controls.maxDistance=10;controls.update();
const home={p:camera.position.clone(),t:controls.target.clone()};

const key=new THREE.DirectionalLight(0xfff0d8,2.6);key.position.set(3.5,5,2.5);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:1,far:14});
key.shadow.radius=4;key.shadow.bias=-0.0004;key.shadow.normalBias=0.02;scene.add(key);
const fill=new THREE.DirectionalLight(0xbcd0ff,0.7);fill.position.set(-4,2.5,2);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,1.1);rim.position.set(-1,3,-5);scene.add(rim);
scene.add(new THREE.HemisphereLight(0xddeeff,0x6a5a3a,0.35));

/* ---------- noise / textures ---------- */
function hash(x,y,z){let h=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return h-Math.floor(h);}
function vnoise(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);const xf=x-xi,yf=y-yi,zf=z-zi;
  const s=t=>t*t*(3-2*t),u=s(xf),v=s(yf),w=s(zf);const L=(a,b,t)=>a+(b-a)*t;
  return L(L(L(hash(xi,yi,zi),hash(xi+1,yi,zi),u),L(hash(xi,yi+1,zi),hash(xi+1,yi+1,zi),u),v),
           L(L(hash(xi,yi,zi+1),hash(xi+1,yi,zi+1),u),L(hash(xi,yi+1,zi+1),hash(xi+1,yi+1,zi+1),u),v),w);}
function fbm(x,y,z){return vnoise(x,y,z)*0.55+vnoise(x*2.1,y*2.1,z*2.1)*0.3+vnoise(x*4.3,y*4.3,z*4.3)*0.15;}
function noiseTex(size,base,amp,streak,rep,srgb){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  const d=g.createImageData(size,size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    let n=hash(x*.37,y*1.13,1.7)*0.5+hash(x*.11,y*.31,3.3)*0.5;
    if(streak)n=n*0.6+hash(x*0.9,y*0.08,9)*0.4;
    const v=Math.max(0,Math.min(255,(base+(n-0.5)*amp)*255));
    const i=(y*size+x)*4;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  g.putImageData(d,0,0);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);
  if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;}
const furBump=noiseTex(256,0.5,0.9,true,3);
const furRough=noiseTex(128,0.88,0.25,false,3);

/* ground */
function grassTex(){
  const s=512,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');
  g.fillStyle='#6f8a4a';g.fillRect(0,0,s,s);
  for(let i=0;i<9000;i++){const x=Math.random()*s,y=Math.random()*s;const l=Math.random();
    g.fillStyle=`hsla(${78+Math.random()*30},${35+Math.random()*25}%,${24+l*26}%,0.55)`;
    for(const ox of[-s,0,s])for(const oy of[-s,0,s]){const X=x+ox,Y=y+oy;if(X<-6||X>s+6||Y<-6||Y>s+6)continue;g.fillRect(X,Y,2,4+Math.random()*5);}}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(6,6);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const gTex=grassTex();
const ground=new THREE.Mesh(new THREE.CircleGeometry(12,64),new THREE.MeshStandardMaterial({map:gTex,roughness:1,bumpMap:furBump,bumpScale:0.5}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const TILE=12*2/6;

/* ---------- materials ---------- */
const M={
  hide:new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.9,roughnessMap:furRough,bumpMap:furBump,bumpScale:1.2,metalness:0}),
  nose:new THREE.MeshStandardMaterial({color:0xb48079,roughness:0.45,bumpMap:furBump,bumpScale:0.3}),
  pink:new THREE.MeshStandardMaterial({color:0xd2a095,roughness:0.55}),
  horn:new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.4,bumpMap:noiseTex(128,0.5,0.6,true,2),bumpScale:0.6}),
  hoof:new THREE.MeshStandardMaterial({color:0x2b231e,roughness:0.55}),
  eye:new THREE.MeshStandardMaterial({color:0x140d0a,roughness:0.12,metalness:0.1}),
  tuft:new THREE.MeshStandardMaterial({color:0x4a2c19,roughness:0.95,bumpMap:furBump}),
};

/* ---------- geometry helpers ---------- */
const parts={};const hideMeshes=[];
function G(name,parent,x=0,y=0,z=0){const g=new THREE.Group();g.name=name;g.position.set(x,y,z);parent&&parent.add(g);parts[name]=g;g.userData.rest=g.position.clone();return g;}
function add(parent,geo,mat,hide){const m=new THREE.Mesh(geo,mat);m.castShadow=true;m.receiveShadow=true;parent.add(m);if(hide)hideMeshes.push(m);return m;}
function ell(parent,rx,ry,rz,x,y,z,mat=M.hide,ws=24,hs=16,rot){
  const g=new THREE.SphereGeometry(1,ws,hs);g.scale(rx,ry,rz);
  if(rot){g.rotateX(rot[0]||0);g.rotateY(rot[1]||0);g.rotateZ(rot[2]||0);}
  g.translate(x,y,z);return add(parent,g,mat,mat===M.hide);}
function limb(parent,len,rt,rb,mat=M.hide,seg=14){const g=new THREE.CylinderGeometry(rt,rb,len,seg,1);g.translate(0,-len/2,0);return add(parent,g,mat,mat===M.hide);}
function cone(parent,r,h,x,y,z,rot,mat=M.tuft,seg=6){const g=new THREE.ConeGeometry(r,h,seg);g.translate(0,-h/2,0);
  g.rotateX(rot[0]);g.rotateZ(rot[2]);g.translate(x,y,z);return add(parent,g,mat,false);}

/* ---------- build the cow (facing +X, Z is lateral, Y up) ---------- */
const root=new THREE.Group();root.name='cow';scene.add(root);
const body=G('body',root,0,0.72,0);
const ribs=G('ribs',body);
ell(ribs,0.62,0.36,0.30,0,0,0);                 // barrel
ell(ribs,0.5,0.28,0.31,0.0,-0.14,0);            // belly sag
ell(body,0.33,0.37,0.27,0.4,0.02,0);            // chest / shoulders
ell(body,0.34,0.34,0.28,-0.42,0.03,0);          // rump
ell(body,0.2,0.11,0.12,0.36,0.31,0);            // withers hump
ell(body,0.07,0.06,0.07,-0.40,0.31,0.17);       // hook bones
ell(body,0.07,0.06,0.07,-0.40,0.31,-0.17);
ell(body,0.12,0.2,0.2,0.62,-0.12,0);            // brisket
// neck
const neck=G('neck',body,0.55,0.14,0);neck.rotation.z=-0.05;neck.userData.rest.copy(neck.position);
ell(neck,0.31,0.18,0.15,0.2,0,0);
ell(neck,0.22,0.09,0.05,0.2,-0.14,0);          // dewlap
const head=G('head',neck,0.44,0.0,0);head.rotation.z=-0.55;
ell(head,0.17,0.115,0.105,0.1,0,0);             // skull
ell(head,0.15,0.08,0.085,0.27,-0.03,0);         // snout
const muzzle=ell(head,0.07,0.075,0.088,0.4,-0.045,0,M.nose,20,14);muzzle.name='muzzle';
ell(head,0.012,0.012,0.012,0.465,-0.03,0.035,M.hoof,8,6);
ell(head,0.012,0.012,0.012,0.465,-0.03,-0.035,M.hoof,8,6);
ell(head,0.07,0.06,0.07,0.01,0.08,0);           // poll
for(let i=0;i<5;i++)cone(head,0.025,0.1,0.06,0.115,(i-2)*0.028,[0.0,0,Math.PI-0.9]); // forelock tuft
const jaw=G('jaw',head,0.08,-0.07,0);
ell(jaw,0.14,0.04,0.058,0.12,-0.01,0,M.hide,16,10);
ell(jaw,0.04,0.03,0.04,0.27,-0.02,0,M.nose,12,8);
cone(jaw,0.02,0.07,0.2,-0.05,0,[0,0,Math.PI],M.tuft,5); // chin whisker
// eyes
for(const s of[1,-1]){
  const e=G(s>0?'eyeL':'eyeR',head,0.16,0.05,s*0.085);
  ell(e,0.026,0.026,0.02,0,0,0,M.eye,14,10);
  ell(e,0.034,0.034,0.026,-0.003,0,-0.0,M.hide,14,10).scale.set(1,1,0.55); // lid cover (used for blink)
  e.children[1].visible=false;
  ell(head,0.035,0.012,0.04,0.13,0.085,s*0.08,M.hide,10,6); // brow
}
// ears
for(const s of[1,-1]){
  const ear=G(s>0?'earL':'earR',head,0.0,0.085,s*0.1);
  ear.rotation.x=s*0.45;ear.rotation.y=s*-0.25;ear.userData.rest=ear.rotation.clone();
  ell(ear,0.03,0.05,0.1,0,0,s*0.09,M.hide,12,8);
  ell(ear,0.012,0.032,0.07,0.018,0,s*0.09,M.pink,10,6);
}
// horns (tapered, curved outward then forward/up)
function horn(s,name){
  const hg=G(name,head,0.02,0.115,s*0.07);
  const pts=[[0,0,0],[0,0.03,0.08],[0.01,0.08,0.15],[0.05,0.15,0.18],[0.12,0.21,0.17],[0.19,0.25,0.14]].map(p=>new THREE.Vector3(p[0],p[1],p[2]*s));
  const curve=new THREE.CatmullRomCurve3(pts);const TS=22,RS=8;
  const geo=new THREE.TubeGeometry(curve,TS,0.04,RS,false);
  const pos=geo.attributes.position,col=new Float32Array(pos.count*3);
  const c1=new THREE.Color(0xd9cfb2),c2=new THREE.Color(0x2f2822),c=new THREE.Color();
  for(let i=0;i<pos.count;i++){const ring=Math.floor(i/(RS+1)),f=ring/TS;const ctr=curve.getPoint(f);
    const k=Math.pow(1-f,0.85)*0.9+0.1;const v=new THREE.Vector3().fromBufferAttribute(pos,i);
    v.sub(ctr).multiplyScalar(k).add(ctr);pos.setXYZ(i,v.x,v.y,v.z);
    c.copy(c1).lerp(c2,THREE.MathUtils.smoothstep(f,0.55,0.9));col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();
  add(hg,geo,M.horn,false);
  ell(hg,0.048,0.045,0.048,0,0,0,M.horn,10,8).geometry.setAttribute('color',new THREE.BufferAttribute(new Float32Array(10*0+ (11*9*3)).fill(0.8),3));
}
horn(1,'hornL');horn(-1,'hornR');
// udder
const udder=G('udder',body,-0.3,-0.33,0);
ell(udder,0.14,0.1,0.13,0,0,0,M.pink,16,12);
for(const[x,z]of[[0.06,0.05],[0.06,-0.05],[-0.05,0.05],[-0.05,-0.05]])cone(udder,0.022,0.07,x,-0.07,z,[0,0,Math.PI],M.pink,8).rotation.z=Math.PI;
// legs
function leg(name,x,z,front){
  const up=G(name+'_upper',body,x,-0.1,z);
  const lo=G(name+'_lower',up,0,-0.30,0);
  const ho=G(name+'_hoof',lo,0,-0.26,0);
  if(front){ell(up,0.12,0.16,0.1,0,-0.06,0);limb(up,0.30,0.085,0.05);}
  else{ell(up,0.15,0.21,0.12,-0.02,-0.08,0);limb(up,0.30,0.095,0.05);}
  ell(up,0.055,0.055,0.055,0,-0.30,0,M.hide,12,8);
  limb(lo,0.23,0.042,0.034,M.hide,12);
  ell(lo,0.042,0.045,0.042,0,-0.23,0,M.hide,12,8);
  const h=new THREE.CylinderGeometry(0.036,0.052,0.065,14,1);h.translate(0.006,-0.032,0);
  add(ho,h,M.hoof,false);
  if(front){up.rotation.z=0;lo.rotation.z=0;}else{up.rotation.z=0.16;lo.rotation.z=-0.28;ho.rotation.z=0.12;}
  [up,lo,ho].forEach(g=>g.userData.rest=g.rotation.clone());
}
leg('legFL',0.42,-0.19,true);leg('legFR',0.42,0.19,true);
leg('legBL',-0.46,-0.19,false);leg('legBR',-0.46,0.19,false);
// tail (4 chained segments + switch)
const tail=[];let tp=G('tail',body,-0.69,0.2,0);tail.push(tp);tp.rotation.z=-0.2;tp.userData.rest=tp.rotation.clone();
ell(tp,0.04,0.04,0.04,0,0,0,M.hide,10,8);
for(let i=0;i<4;i++){
  const seg=i===0?tp:G('tail'+(i+1),tp,0,-0.19,0);
  if(i>0){tail.push(seg);seg.userData.rest=seg.rotation.clone();}
  limb(seg,0.19,0.03-i*0.004,0.026-i*0.004,M.hide,8);
  tp=seg;
}
parts.tail1=parts.tail;
{const tt=tail[3];
 ell(tt,0.045,0.1,0.045,0,-0.25,0,M.tuft,12,8);
 for(let i=0;i<7;i++){const a=i/7*Math.PI*2;cone(tt,0.025,0.13,Math.cos(a)*0.03,-0.17,Math.sin(a)*0.03,[Math.sin(a)*0.15,0,Math.PI+Math.cos(a)*0.15],M.tuft,5).position.y-=0.0;}}
tail.forEach((t,i)=>parts['tail'+(i+1)]=t);

/* ---------- vertex colouring of hide ---------- */
const BROWN=new THREE.Color(0x8a5532),CREAM=new THREE.Color(0xe7dcc5),DARK=new THREE.Color(0x4a2a18);
root.updateMatrixWorld(true);
const tmp=new THREE.Vector3(),tc=new THREE.Color(),hl=new THREE.Vector3();
const ss=THREE.MathUtils.smoothstep;
for(const m of hideMeshes){
  const geo=m.geometry,pos=geo.attributes.position,col=new Float32Array(pos.count*3);
  const inHead=(()=>{let o=m;while(o){if(o===head)return true;o=o.parent;}return false;})();
  for(let i=0;i<pos.count;i++){
    tmp.fromBufferAttribute(pos,i).applyMatrix4(m.matrixWorld);
    const x=tmp.x,y=tmp.y,z=tmp.z;
    let cream=0;
    const n=fbm(x*2.3+3,y*2.3,z*2.3+7);
    cream=Math.max(cream,ss(n,0.6,0.67)*ss(x,-0.9,-0.5)*(x<0.7?1:0));            // flank patches
    cream=Math.max(cream,ss(0.40-y,0.0,0.1)*0.85); // belly & lower legs
    if(y<0.2)cream=Math.max(cream,ss(0.2-y,0,0.08)*0.9);                              // socks
    let c=tc.copy(BROWN).lerp(DARK,ss(fbm(x*6,y*6,z*6),0.5,0.75)*0.5);
    if(inHead){hl.copy(tmp);head.worldToLocal(hl);
      const blaze=ss(0.055-Math.abs(hl.z),0,0.03)*ss(hl.x,0.0,0.08)*ss(hl.y+0.2,0.0,0.1);
      cream=Math.max(cream*0.0,blaze);
      c=tc.copy(BROWN).lerp(DARK,ss(hl.y,-0.05,-0.1)*0.35);}
    if(y>0.2&&!inHead&&x<-0.62)c.lerp(DARK,0.25);                                      // dark tail head
    c.lerp(CREAM,cream);
    const v=0.94+hash(i*0.13,x*9,z*9)*0.12;
    col[i*3]=c.r*v;col[i*3+1]=c.g*v;col[i*3+2]=c.b*v;}
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
}
// fix horn base vertex colours (plain)
parts.hornL.children[1].geometry.getAttribute('color').array.fill(0.8);

/* tris count */
let tris=0;root.traverse(o=>{if(o.isMesh){const g=o.geometry;tris+=(g.index?g.index.count:g.attributes.position.count)/3;}});
console.log('triangles',tris);

/* ---------- animation ---------- */
const TAU=Math.PI*2,sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const wrap=x=>x-Math.round(x);
const pulse=(p,c,w)=>Math.exp(-Math.pow(wrap(p-c)/w,2));
class Pose{constructor(){this.d={};}
  r(n,x=0,y=0,z=0){const a=this.d[n]||(this.d[n]=[0,0,0]);a[0]+=x;a[1]+=y;a[2]+=z;return this;}
  s(n,v){this.d[n]=[(this.d[n]?this.d[n][0]:0)+v,0,0];return this;}}
function tailSwing(P,w,amp,lag,base,burst){
  for(let i=0;i<4;i++){
    P.r('tail'+(i+1),0.0,0.05*Math.sin(w*1-i*lag)*amp*(i+1)*0.5,amp*(0.35+i*0.28)*Math.sin(w-i*lag)+(i?0:base)+burst*Math.sin(w*6-i*0.9)*(0.4+i*0.3));}}
function idle(p){const P=new Pose(),w=p*TAU;
  const br=Math.sin(4*w);
  P.s('breath',br);
  P.r('body',0.004*Math.sin(2*w),0.02*Math.sin(2*w),0.006*br);
  P.r('neck',0,0.07*Math.sin(w+0.6),0.03*Math.sin(w)+0.012*br);
  P.r('head',0.02*Math.sin(2*w),0.22*Math.sin(w+1.2)+0.1*Math.sin(3*w),0.07*Math.sin(2*w+0.5)+0.05*Math.sin(w));
  const eL=pulse(p,0.27,0.018),eR=pulse(p,0.72,0.016),eB=pulse(p,0.5,0.015);
  P.r('earL',0.4*eL+0.05*Math.sin(5*w),-0.55*eL+0.1*eB,0.25*eL);
  P.r('earR',-0.4*eR-0.05*Math.sin(5*w+1),0.55*eR,0.25*eR);
  const sw=pulse(p,0.5,0.07);
  tailSwing(P,2*w,0.2,0.75,0.0,0.18*sw+0);
  P.r('tail1',0,0.35*sw*Math.sin(6*w),0);
  const ch=Math.max(0,Math.sin(12*w));
  P.r('jaw',0,0.05*Math.sin(6*w),-0.03-0.05*ch);
  P.s('blink',pulse(p,0.55,0.012)+pulse(p,0.12,0.012));
  const st=pulse(p,0.82,0.03);
  P.r('legFL_upper',0,0,0.38*st);P.r('legFL_lower',0,0,-0.7*st);P.r('legFL_hoof',0,0,0.3*st);
  P.r('udder',0.02*Math.sin(2*w-0.5),0,0.015*Math.sin(2*w));
  return P;}
const LEGS={BL:0,FL:0.25,BR:0.5,FR:0.75};
function walk(p){const P=new Pose(),w=p*TAU;
  for(const k in LEGS){const f=k[0]==='F',ph=TAU*(p+LEGS[k]);const s=Math.sin(ph),c=Math.max(0,Math.cos(ph));
    const sw=Math.pow(c,1.2);
    P.r('leg'+k+'_upper',0,0,(f?0.36:0.32)*s);
    P.r('leg'+k+'_lower',0,0,f?-0.95*sw:0.75*sw);
    P.r('leg'+k+'_hoof',0,0,(f?0.5:-0.2)*sw-0.18*s*0.3);}
  P.r('body',0.03*Math.sin(w),0.04*Math.sin(w+0.4),0.015*Math.sin(2*w+0.8));
  P.r('body',0,0,0);P.d.body=[0.03*Math.sin(w),0.04*Math.sin(w+0.4),0.015*Math.sin(2*w+0.8)];
  P.r('bodyY',0.014*Math.cos(2*w-0.5));
  P.r('neck',0,-0.06*Math.sin(w+0.4),0.07*Math.sin(2*w-0.9)-0.08);
  P.r('head',0,-0.12*Math.sin(w+0.4),0.06*Math.sin(2*w-1.5)+0.1);
  P.r('earL',0.18*Math.sin(2*w+1),0.1*Math.sin(2*w),0);P.r('earR',-0.18*Math.sin(2*w+1.4),-0.1*Math.sin(2*w),0);
  tailSwing(P,w,0.3,0.8,0.05,0.0);P.r('tail1',0,0.2*Math.sin(w),0);
  P.s('breath',Math.sin(2*w)*0.7);
  P.r('jaw',0,0,-0.025-0.02*Math.sin(4*w));
  P.s('blink',pulse(p,0.7,0.015));
  P.r('udder',0.05*Math.sin(w+0.5),0,0.05*Math.sin(2*w));
  return P;}
function graze(p){const P=new Pose(),w=p*TAU;
  const h=sstep(0.03,0.2,p)*(1-sstep(0.74,0.92,p));
  const tug=pulse(p,0.38,0.015)+pulse(p,0.52,0.015)+pulse(p,0.64,0.015);
  const sweep=Math.sin(w*2-0.5)*h;
  P.r('neck',0,0.12*sweep,-1.0*h+0.08*tug*h+0.03*Math.sin(4*w));
  P.r('head',0,0.18*sweep,-0.62*h+0.12*tug*h+0.04*(1-h)*Math.sin(w));
  P.r('body',0,0.03*sweep,-0.05*h);
  P.r('bodyY',-0.02*h);
  const ch=Math.max(0,Math.sin(16*w));
  P.r('jaw',0,0.07*Math.sin(8*w),-0.04-0.09*ch-0.07*tug*h);
  P.r('earL',0.1*Math.sin(3*w),0.15*h+0.4*pulse(p,0.6,0.02),0.05);P.r('earR',-0.1*Math.sin(3*w+1),-0.15*h,0.05);
  P.s('breath',Math.sin(4*w));
  tailSwing(P,2*w,0.2,0.75,0.0,0.12*pulse(p,0.3,0.05));
  const st=pulse(p,0.45,0.04);
  P.r('legFR_upper',0,0,0.28*st);P.r('legFR_lower',0,0,-0.55*st);
  P.r('legFL_upper',0,0,-0.08*h);P.r('legFR_upper',0,0,-0.08*h);
  P.s('blink',pulse(p,0.2,0.012)+pulse(p,0.85,0.012));
  P.r('udder',0.02*Math.sin(w),0,0);
  return P;}
function moo(p){const P=new Pose(),w=p*TAU;
  const h=sstep(0.04,0.22,p)*(1-sstep(0.78,0.95,p));
  const m1=sstep(0.26,0.32,p)*(1-sstep(0.46,0.52,p)),m2=sstep(0.55,0.6,p)*(1-sstep(0.68,0.73,p));
  const mo=Math.max(m1,m2);
  const wob=Math.sin(w*14)*0.04*mo;
  P.r('neck',0,0.05*h*Math.sin(w*2),0.34*h+0.05*mo);
  P.r('head',0,0.08*h*Math.sin(w*2),0.5*h+0.12*mo+wob);
  P.r('body',0,0,-0.03*h+0.01*mo);
  P.r('bodyY',0.01*h);
  P.r('jaw',0,0,-0.02-0.3*mo+0.03*Math.sin(w*14)*mo);
  P.s('breath',-0.5*h+Math.sin(w*14)*0.6*mo+0.8*mo);
  P.r('earL',0.1*mo,-0.3*h,0.1*h);P.r('earR',-0.1*mo,0.3*h,0.1*h);
  tailSwing(P,2*w,0.25,0.75,0.04,0.15*mo);
  P.r('legFL_upper',0,0,0.05*h);P.r('legFR_upper',0,0,0.05*h);
  P.s('blink',0.8*mo+pulse(p,0.9,0.012));
  P.r('udder',0.015*Math.sin(w*14)*mo,0,0);
  return P;}
const clips={
  idle:{name:'Покой',duration:6,update:idle},
  walk:{name:'Шаг',duration:1.7,update:walk},
  graze:{name:'Пастьба',duration:8,update:graze},
  moo:{name:'Мычание',duration:5,update:moo}};

const st={clip:'idle',t:0,prev:null,pt:0,blend:1,play:true,speed:1,walkAmt:0};
function blendPose(a,b,k){const r={};const keys=new Set([...Object.keys(a.d),...Object.keys(b.d)]);
  for(const n of keys){const x=a.d[n]||[0,0,0],y=b.d[n]||[0,0,0];r[n]=[x[0]+(y[0]-x[0])*k,x[1]+(y[1]-x[1])*k,x[2]+(y[2]-x[2])*k];}return r;}
const ribRest=1;
function applyPose(d){
  for(const n in parts){const g=parts[n];const r=g.userData.rest;if(!r)continue;
    const o=d[n];
    if(r.isEuler){g.rotation.set(r.x+(o?o[0]:0),r.y+(o?o[1]:0),r.z+(o?o[2]:0));}}
  const b=d.body||[0,0,0];body.rotation.set(b[0],b[1],b[2]);
  body.position.y=0.72+(d.bodyY?d.bodyY[0]:0);
  const br=d.breath?d.breath[0]:0;ribs.scale.set(1+0.012*br,1+0.022*br,1+0.02*br);
  const bl=d.blink?Math.min(1,d.blink[0]):0;
  for(const e of[parts.eyeL,parts.eyeR]){e.scale.set(1,1-0.9*bl,1);}
}
// rests for rotating groups: store euler
for(const n in parts){const g=parts[n];if(!g.userData.rest||!g.userData.rest.isEuler)g.userData.rest=g.rotation.clone();}
// body should use absolute rotation (rest 0), handled above; neck/head rests retained
function evaluate(){
  const c=clips[st.clip];let pose=c.update((st.t/c.duration)%1).d;
  if(st.prev&&st.blend<1){const pc=clips[st.prev];const pp=pc.update((st.pt/pc.duration)%1);
    const k=st.blend*st.blend*(3-2*st.blend);pose=blendPose(pp,{d:pose},k);}
  applyPose(pose);
}
function setClip(n){if(n===st.clip)return;st.prev=st.clip;st.pt=st.t;st.clip=n;st.t=0;st.blend=0;
  document.querySelectorAll('#clips button').forEach(b=>b.classList.toggle('on',b.dataset.c===n));}
function step(dt){
  dt=Math.min(dt,0.05)*st.speed;
  st.t+=dt;if(st.prev){st.pt+=dt;st.blend=Math.min(1,st.blend+dt/0.6);if(st.blend>=1)st.prev=null;}
  const wTarget=(st.clip==='walk'?1:0)*(st.prev==='walk'?1:1);
  const wk=st.clip==='walk'?st.blend:(st.prev==='walk'?1-st.blend:0);
  const ph=(st.t/clips.walk.duration);
  gTex.offset.x+=wk*0.52*dt/TILE;
  evaluate();
}
const bar=document.getElementById('clips');
for(const k in clips){const b=document.createElement('button');b.textContent=clips[k].name;b.dataset.c=k;b.onclick=()=>setClip(k);bar.appendChild(b);}
bar.firstChild.classList.add('on');
const sp=document.getElementById('sp'),spv=document.getElementById('spv');
sp.oninput=()=>{st.speed=+sp.value;spv.textContent=(+sp.value).toFixed(1);};
const pp=document.getElementById('pp');
pp.onclick=()=>{st.play=!st.play;pp.textContent=st.play?'Пауза':'Играть';};
document.getElementById('rs').onclick=()=>{st.t=0;st.prev=null;st.blend=1;gTex.offset.set(0,0);camera.position.copy(home.p);controls.target.copy(home.t);controls.update();evaluate();};

window.animal={root,parts,clips,camera,controls,setClip,
  seek(n,t){st.clip=n;st.prev=null;st.blend=1;st.t=t;st.play=false;evaluate();},
  view(px,py,pz,tx=0,ty=0.62,tz=0){camera.position.set(px,py,pz);controls.target.set(tx,ty,tz);controls.update();},
  triangles:tris};
evaluate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(st.play)step(dt);controls.update();renderer.render(scene,camera);window.__frames=(window.__frames||0)+1;});
</script>
