<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ниндзи — NPC (15 видов)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--ink:#2a2723;--mute:#7a746b;--card:rgba(255,255,255,.86);--accent:#b8861b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font:14px/1.35 -apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  body{background:radial-gradient(ellipse at 50% 38%,#f6f4ef 0%,#e4e1d9 55%,#c9c5bb 100%)}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  .hud{position:fixed;left:14px;top:14px;bottom:14px;width:250px;padding:12px;border-radius:14px;background:var(--card);backdrop-filter:blur(10px);
       box-shadow:0 6px 24px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:8px;overflow:hidden}
  .hud h1{font-size:15px;margin:0}
  .hud small{color:var(--mute)}
  .list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;padding-right:2px}
  button{font:inherit;border:1px solid #d6d1c6;background:#fff;border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--ink);text-align:left}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .clips{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .clips button{text-align:center}
  label.r{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .chk{display:flex;gap:6px;align-items:center;font-size:13px}
  .row{display:flex;gap:5px}.row button{flex:1;text-align:center}
  #loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--mute);pointer-events:none}
  #title{position:fixed;right:18px;top:14px;text-align:right;pointer-events:none}
  #title b{font-size:20px;display:block}
  body.nohud .hud,body.nohud #title{display:none}
</style>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="loading">Собираю жителей…</div>
<div id="title"><b id="tName"></b><span id="tRole"></span></div>
<div class="hud" id="hud">
  <h1>NPC острова · 15 видов</h1>
  <small>перетащи — вращать, колесо — зум</small>
  <div class="list" id="list"></div>
  <div class="clips" id="clips"></div>
  <div class="row"><button id="play">⏸ Пауза</button><button id="glb">⬇ .glb</button></div>
  <label class="r">Скорость <span id="vSpeed">1.0×</span></label><input id="speed" type="range" min="0.1" max="2" step="0.05" value="1">
  <div class="chk"><input id="rot" type="checkbox"><span>Авто-вращение камеры</span></div>
  <div class="chk"><input id="props" type="checkbox" checked><span>Реквизит (наковальня, котёл…)</span></div>
  <div class="chk"><input id="circle" type="checkbox" checked><span>Ходьба по кругу</span></div>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
import {NPC_LIST, makeNPC} from './npc.js';

const Q = new URLSearchParams(location.search);
if (Q.get('hud') === '0') document.body.classList.add('nohud');

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.52;
const sun = new THREE.DirectionalLight(0xfff1d6, 2.4); sun.position.set(4, 7, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left:-9, right:9, top:9, bottom:-9, near:1, far:25}); sun.shadow.bias = -0.0005;
scene.add(sun, new THREE.HemisphereLight(0xffffff, 0xb8b2a0, 0.5));
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({color: 0xd9d4c6, roughness: 1}));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

/* ───── NPC ───── */
const npcs = NPC_LIST.map(d => { const n = makeNPC(d); scene.add(n.root); return n; });
const COLS = 5, GAP = 2.7, RGAP = 3.4;
npcs.forEach((n, i) => {
  const c = i % COLS, r = Math.floor(i / COLS);
  n.grid = new THREE.Vector3((c - (COLS - 1) / 2) * GAP, 0, -r * RGAP + RGAP);
  n.t += i * 0.7;
});

let sel = Math.max(0, NPC_LIST.findIndex(d => d.id === Q.get('npc'))), all = Q.get('all') === '1';
let clip = Q.get('clip') || 'work', playing = true, speed = 1, circleA = 0;
const CLIP_NAMES = {idle: 'Стоит', walk: 'Идёт', talk: 'Говорит', work: 'Работает'};
const $ = id => document.getElementById(id);

const list = $('list');
list.innerHTML = '';
const allBtn = document.createElement('button'); allBtn.textContent = '👥 Все вместе';
allBtn.onclick = () => { all = true; refresh(); }; list.appendChild(allBtn);
const btns = NPC_LIST.map((d, i) => {
  const b = document.createElement('button'); b.textContent = `${d.icon}  ${d.name}`; b.title = d.role;
  b.onclick = () => { sel = i; all = false; refresh(); }; list.appendChild(b); return b;
});
const clipBtns = {};
Object.keys(CLIP_NAMES).forEach(k => {
  const b = document.createElement('button'); b.textContent = CLIP_NAMES[k];
  b.onclick = () => { clip = k; refresh(); }; $('clips').appendChild(b); clipBtns[k] = b;
});

function frame() {
  const n = npcs[sel];
  if (all) {
    controls.target.set(0, 0.8, 0.2); const dd = Math.max(15, 7.4 / (Math.tan(THREE.MathUtils.degToRad(18)) * camera.aspect)); camera.position.set(0, dd * 0.3, dd);
  } else {
    const h = n.def.height;
    controls.target.set(0, 0.98 * h, 0);
    const az = {front: 0, side: 1.2, back: 3.14, three: 0.6}[Q.get('cam') || 'three'];
    const d = 6.2 * (0.6 + 0.4 * h);
    camera.position.set(Math.sin(az) * d, 0.98 * h + 0.5, Math.cos(az) * d);
  }
  controls.update();
}
function refresh() {
  npcs.forEach((n, i) => {
    n.root.visible = all || i === sel;
    n.setClip(clip);
    n.root.position.copy(all ? n.grid : n.home); n.root.rotation.y = 0;
  });
  btns.forEach((b, i) => b.classList.toggle('on', !all && i === sel));
  allBtn.classList.toggle('on', all);
  Object.entries(clipBtns).forEach(([k, b]) => b.classList.toggle('on', k === clip));
  clipBtns.work.textContent = all ? 'Работает' : npcs[sel].def.workLabel;
  $('tName').textContent = all ? 'Жители острова' : npcs[sel].def.name;
  $('tRole').textContent = all ? '15 видов' : npcs[sel].def.role;
  if (!all) history.replaceState(null, '', '#' + npcs[sel].def.id);
  frame();
}
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '⏸ Пауза' : '▶ Играть'; };
$('speed').oninput = e => { speed = +e.target.value; $('vSpeed').textContent = speed.toFixed(1) + '×'; };
$('rot').onchange = e => controls.autoRotate = e.target.checked; controls.autoRotateSpeed = 1.5;
$('glb').onclick = () => {
  const n = npcs[sel]; if (n.station) n.station.visible = false;
  new GLTFExporter().parse(n.root, buf => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], {type: 'model/gltf-binary'}));
    a.download = n.def.id + '.glb'; a.click();
  }, e => alert('Ошибка экспорта: ' + e), {binary: true});
};
if (Q.get('rot') === '1') { controls.autoRotate = true; $('rot').checked = true; }
if (location.hash && !Q.get('npc')) { const i = NPC_LIST.findIndex(d => d.id === location.hash.slice(1)); if (i >= 0) sel = i; }
refresh();
$('loading').remove();

let last = performance.now(), fixedT = null;
if (Q.get('t')) fixedT = +Q.get('t');
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const d = playing ? dt * speed : 0;
  const circle = $('circle').checked && !all && clip === 'walk';
  if (circle) circleA += d * 0.5 / Math.max(0.6, npcs[sel].def.height);
  npcs.forEach((n, i) => {
    if (!n.root.visible) return;
    if (fixedT != null && !n._fixed) { n._fixed = true; n.t = 0; for (let k = 0; k < 60; k++) n.update(fixedT / 60); }
    if (fixedT == null) n.update(d || 1e-4);
    if (n.station) n.station.visible = clip === 'work' && $('props').checked;
    if (circle && i === sel) {
      const R = 1.8; n.root.position.set(Math.sin(circleA) * R, 0, Math.cos(circleA) * R);
      n.root.rotation.y = Math.atan2(Math.cos(circleA), -Math.sin(circleA));
    }
  });
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
window.__ready = true;
</script>
</body>
</html>
